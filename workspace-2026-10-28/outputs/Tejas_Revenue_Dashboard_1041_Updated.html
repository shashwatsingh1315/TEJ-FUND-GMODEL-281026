  if(D.on){const qc=D.draw.findIndex(v=>v>0.005),qw=D.wcBal.findIndex(v=>v>0.005);if(qc>=0)out.push({q:qc,debt:1,label:'Plant loan'});if(qw>=0&&qw!==qc)out.push({q:qw,debt:1,label:'WC limit'});}return out;};
function capPath(pts){return pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');}
function cashSaw(c,R,y,cash=R.cash){ /* cash in hand at each quarter end; jumps when a round closes */
  const pts=[];let prev=null;
  for(let q=c.q0;q<=c.q1;q++){const amt=sum(R.rounds.filter(r=>r.q===q).map(r=>r.amt)),x0=c.x(q)-c.slot/2,x1=c.x(q);
    if(amt>0){const before=(q>0&&prev!=null)?prev:0;pts.push([x0,y(before)],[x0,y(before+amt)]);}else if(prev==null)pts.push([x0,y(q>0?cash[q-1]:0)]);
    pts.push([x1,y(cash[q])]);prev=cash[q];}
  return capPath(pts);
}

/* ---------- step navigation: Next goes beat by beat, then step by step ---------- */
const capBeat=i=>Math.min(A.cap.beat[i]||0,CAP_BEATS[i].length-1);
function stepNav(page,i){
  const s=STEPS[page],nextPage=PAGE_ORDER[PAGE_ORDER.indexOf(page)+1];
  if(page!=='finance'){
    const prev=i>0?`<button type="button" class="step-prev" data-step="${i-1}">← ${i}. ${s[i-1]}</button>`:'<span></span>';
    const next=i<s.length-1?`<button type="button" class="step-next" data-step="${i+1}"><small>Next section</small>${i+2}. ${s[i+1]} →</button>`:nextPage?`<button type="button" class="step-next" data-goto="${nextPage}"><small>Next page</small>${PAGE_NAME[nextPage]} →</button>`:'';
    return `<div class="step-nav">${prev}${next}</div>`;
  }
  const b=capBeat(i),nb=CAP_BEATS[i].length;
  const prev=b>0?`<button type="button" class="step-prev" data-cap="beat:${b-1}">← ${CAP_BEATS[i][b-1][1]}</button>`:i>0?`<button type="button" class="step-prev" data-step="${i-1}">← ${i}. ${s[i-1]}</button>`:'<span></span>';
  const next=b<nb-1?`<button type="button" class="step-next" data-cap="beat:${b+1}"><small>Next</small>${CAP_BEATS[i][b+1][1]} →</button>`:i<s.length-1?`<button type="button" class="step-next" data-step="${i+1}"><small>Next section</small>${i+2}. ${s[i+1]} →</button>`:nextPage?`<button type="button" class="step-next" data-goto="${nextPage}"><small>Next page</small>${PAGE_NAME[nextPage]} →</button>`:'';
  return `<div class="step-nav">${prev}${next}</div>`;
}
function stepKey(e){
  if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey)return;
  const t=e.target;if(t&&(t.closest('input,select,textarea,[contenteditable]')||t.closest('[data-chart-quarter]')))return;
  if(!['ArrowRight','ArrowLeft'].includes(e.key)||!PAGE_ORDER.includes(A.page))return;
  e.preventDefault();
  const idx=PAGE_ORDER.indexOf(A.page),n=STEPS[A.page]?STEPS[A.page].length:1,i=STEPS[A.page]?A.steps[A.page]:0,fwd=e.key==='ArrowRight';
  if(A.page==='finance'){const b=capBeat(i),nb=CAP_BEATS[i].length;
    if(fwd&&b<nb-1){A.cap.beat[i]=b+1;refreshFinance(true);return;}
    if(!fwd&&b>0){A.cap.beat[i]=b-1;refreshFinance(true);return;}}
  if(fwd){if(i<n-1)setStep(i+1);else if(PAGE_ORDER[idx+1])go('#'+PAGE_ORDER[idx+1]);}
  else{if(i>0)setStep(i-1);else if(idx>0){const pp=PAGE_ORDER[idx-1];go('#'+pp+(STEPS[pp]?'/s'+STEPS[pp].length:''));}}
}
function refreshFinance(top){const y=scrollY;hideTip();renderFinance();fitCharts();glueUnits($('main-content'));
  const m=$('main-content');if(top){m.classList.remove('enter','enter-step');void m.offsetWidth;if(!matchMedia('(prefers-reduced-motion: reduce)').matches)m.classList.add('enter-step');scrollTo(0,0);}else scrollTo(0,y);}

/* ---------- controls ---------- */
const seg=(items,cur,key,label)=>`<div class="segmented cap-seg" role="group" aria-label="${label}">${items.map(([v,l])=>`<button type="button" data-cap="${key}:${v}" aria-pressed="${String(v)===String(cur)}">${l}</button>`).join('')}</div>`;
function beatBar(i){const b=capBeat(i);return CAP_BEATS[i].length>1?`<div class="cap-beats" role="tablist" aria-label="Views in this section">${CAP_BEATS[i].map(([k,l],j)=>`<button type="button" role="tab" data-cap="beat:${j}" aria-selected="${j===b}"><span>${String.fromCharCode(97+j)}</span>${l}</button>`).join('')}</div>`:'';}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-cap]');if(!el||A.page!=='finance')return;
  const [k,v]=el.dataset.cap.split(':'),C=A.cap,i=A.steps.finance;
  if(k==='beat'){C.beat[i]=+v;refreshFinance(true);return;}
  if(k==='view')C.view=v;else if(k==='iso')C.iso=C.iso===v?null:v;else if(k==='earnq')C.earnQ=+v;else if(k==='gapq')C.gapQ=+v;
  else if(k==='round')C.round=+v;else if(k==='exitq')C.exitQ=Math.max(0,Math.min(15,+v));else if(k==='selq')C.selQ=Math.max(0,Math.min(15,+v));else if(k==='exitm'){const [m,x]=v.split('-');C.exitM=m;if(x)C.exitMult=+x;}
  else if(k==='ach')C.ach=+v;else if(k==='cell'){const [t,mk]=v.split('|');C.exitQ=+t;const [m,x]=mk.split('-');C.exitM=m;if(x)C.exitMult=+x;}else if(k==='stress')C.stress[v]=!C.stress[v];
  else if(k==='wc'){INP.funding.wcBasis=+v;saveInputs();}
  refreshFinance();
});
document.addEventListener('change',e=>{if(A.page==='finance'&&e.target.dataset&&e.target.dataset.input&&e.target.closest('#main-content'))refreshFinance();});
document.addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('cap-drawer'))A.cap.drawer=e.target.open;if(e.target.tagName==='DETAILS')requestAnimationFrame(fitCharts);},true);

/* ====================== v16: page 03 — one chart that stays, built up step by step; the working on the right ====================== */
const CX_REV='#3976B9',CX_PAT='#24735A',CX_FIX='#7667A7',CX_VAR='#C69B50',CX_COGS='#B7C5D5',CX_HOLE='#F8E7E4',CX_GREY='#9C998F',CX_NEG='#B34641',CX_CASH='#193B63',CX_VALUE='#6C5798';
const KEYQ=[0,3,7,11,15];
const capLink=(h,l)=>`<a href="#${h}" class="cap-link">${l} →</a>`;
const swc=(c,extra='')=>`<i class="sw" style="background:${c};${extra}"></i>`;
const sr=v=>(v<-0.005?'−':'')+rc(v);
const pct2=v=>fd(v*100,2)+'%';
const pctR=v=>(v<-0.5?'−':'')+fd(Math.abs(v),0)+'%';
const nlab=v=>(v<-0.05?'−':'')+fd(Math.abs(v),Math.abs(v)<10?1:0);
const unitsBy=(ch,q)=>MODEL.live.filter(l=>UNIT_META[l.type].channel===ch).length+UNIT_TYPES.filter(t=>t.channel===ch).reduce((s,t)=>s+sum(MODEL.openings[t.id].slice(0,q+1)),0);
const selQ=()=>Math.max(0,Math.min(15,A.cap.selQ??10));
const cxH=()=>Math.max(250,Math.min(460,(window.innerHeight||864)-570));

/* the money, quarter by quarter: one set of series feeds the chart and the panels */
function cxSeries(D){
  const Q=D.I.Q,G=D.G,R=D.R,fl=G.flows,sp=Q.map((_,q)=>fl.capex[q]+fl.pp[q]+fl.wc[q]),pat=G.pat,ncf=pat.map((p,q)=>p-sp[q]);let a=0;const cum=ncf.map(v=>a+=v);
  const pk=cum.indexOf(Math.min(...cum)),back=cum.findIndex((v,q)=>q>pk&&v>=0),cross=ncf.findIndex((v,q)=>q>0&&v>0&&ncf[q-1]<=0);
  return {Q,net:Q.map(r=>r.net),pat,sp,ncf,cum,cash:R.cash,base:R.base,fl,pk,peak:-cum[pk],back,cross};
}

/* ---------- the frame every chart on this page shares: same width, same quarter positions ---------- */
function cxFrame(W,h){const ml=60,mr=86,pw=W-ml-mr,slot=pw/16,top=24,rowT=top+h+8,axT=rowT+30;return {ml,mr,pw,slot,x:q=>ml+(q+.5)*slot,top,h,W,rowT,axT,H:axT+34};}
/* the value row under the plot: one number per quarter, the chosen quarter picked out */
function cxRow(c,vals,label,sel,col){let s=`<line x1="${c.ml}" x2="${c.ml+c.pw}" y1="${c.rowT+0.5}" y2="${c.rowT+0.5}" stroke="#E6E3DA"/>`+label.map((l,i)=>T(c.ml-8,c.rowT+11+i*12,l,'smut','end','font-size:11px')).join('');vals.forEach((v,q)=>{const on=q===sel;s+=T(c.x(q),c.rowT+18,v.t,'smono','middle',`font-size:${on?12.5:11.5}px;font-weight:${on?700:500};fill:${on?ACCENT_TXT:(v.c||col||'#3D3C38')}`);});return s;}
function cxAxisX(c,sel){let s='';for(let q=0;q<16;q++)s+=T(c.x(q),c.axT+13,qName(q),'slab-b','middle',`font-size:12px;${q===sel?`fill:${ACCENT_TXT}`:''}`)+T(c.x(q),c.axT+27,EXIT[q],'smut','middle','font-size:11px');return s;}
const cxBand=(c,q)=>q==null?'':`<rect x="${(c.x(q)-c.slot/2).toFixed(1)}" y="${c.top-10}" width="${c.slot.toFixed(1)}" height="${c.rowT+26-c.top+10}" fill="#F3F1EB" rx="3"/>`;
const cxHits=(c,key)=>{let s='';for(let q=0;q<16;q++)s+=`<rect class="qhit" data-cap="${key}:${q}" x="${(c.x(q)-c.slot/2).toFixed(1)}" y="${c.top-10}" width="${c.slot.toFixed(1)}" height="${c.rowT+26-c.top+10}"><title>${qLong(q)}</title></rect>`;return s;};
const ly=(show,ghost,body)=>`<g class="ly" data-show="${show}"${ghost?` data-ghost="${ghost}"`:''}>${body}</g>`;
let cxN=0;

/* steps 1–5: one chart, one scale; each step adds a layer and fades the one before */
function cxMoney(W,D){
  const S=cxSeries(D),c=cxFrame(W,cxH()),sel=selQ(),R=D.R,P=R.P,Q=S.Q,N=16,id=++cxN;
  const lo=Math.min(0,...S.cum,...S.sp.map(v=>-v),...S.cash,...S.base),hi=Math.max(...S.net,...S.cash)*1.22;
  const ax=axisY(c,lo,hi,{n:8}),y=ax.y,y0=y(0),bw=Math.min(36,c.slot*.6);
  const bar=(x,a,b,fill,title)=>{const t=Math.min(y(a),y(b)),h=Math.abs(y(a)-y(b));return `<rect x="${(x-bw/2).toFixed(1)}" y="${t.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${fill}">${title?`<title>${title}</title>`:''}</rect>`;};
  let tot='',costs='',pats='',burn='',spend='',cashPats='',cashBurn='',marginNotes='';
  for(let q=0;q<N;q++){
    const w=Q[q],x=c.x(q),p=w.pat,fx=w.fixed;let acc=Math.max(0,p);
    tot+=bar(x,0,w.net,CX_REV,`${qLong(q)} · net revenue ${rc(w.net)}`);
    if(p>0)pats+=bar(x,0,p,CX_PAT,`${qLong(q)} · Operating profit ${sr(p)} (${pct1(w.patP)} of revenue)`);
    [[fx,CX_FIX,'Common overhead'],[w.variable,CX_VAR,'Selling costs'],[w.cogs,CX_COGS,'Materials (COGS)']].forEach(([v,col,l])=>{costs+=bar(x,acc,acc+v,col,`${qLong(q)} · ${l}: ${rc(v)}`);acc+=v;});
    if(p<0)burn+=`<rect x="${(x-bw/2).toFixed(1)}" y="${y0.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(y(p)-y0,2).toFixed(1)}" fill="${CX_NEG}"><title>${qLong(q)} · burn: Operating profit ${sr(p)}</title></rect>`;
    if([0,3,7,11,15].includes(q)){const top=w.cogs+w.variable+fx+Math.max(0,p);marginNotes+=T(x,y(top)-9,pctR(w.patP),'smono','middle',`font-size:12.5px;font-weight:700;fill:${p<0?CX_NEG:CX_PAT};${halo}`);}
    const cashP=S.pat[q];if(cashP>=0)cashPats+=bar(x,0,cashP,CX_PAT,`${qLong(q)} · estimated operating earnings during quarter: ${sr(cashP)}`);else cashBurn+=bar(x,0,cashP,CX_NEG,`${qLong(q)} · estimated operating deficit during quarter: ${sr(cashP)}`);
    let d=0;[['capex','Capex'],['pp','Intangibles'],['wc','Working capital'],['interest','Loan interest']].forEach(([k,l])=>{const v=Math.max(0,S.fl[k][q]);spend+=bar(x,-d,-d-v,CAP4C[k],`${qLong(q)} · ${l}: ${rc(v)}`);d+=v;});
  }
  /* step 4: the running total and the hole under zero */
  const x0=c.x(0)-c.slot/2,start=`M${x0.toFixed(1)} ${y0.toFixed(1)}`,pts=v=>v.map((u,q)=>`L${c.x(q).toFixed(1)} ${y(u).toFixed(1)}`).join('');
  const cl=start+pts(S.cum),pk=S.pk;
  let cum=`<path d="${cl}L${c.x(N-1).toFixed(1)} ${y0.toFixed(1)}Z" fill="${CX_HOLE}" clip-path="url(#cxneg${id})"/><path d="${cl}" fill="none" stroke="${CX_NEG}" stroke-width="2.5" stroke-linejoin="round"/>`;
  S.cum.forEach((v,q)=>{cum+=`<circle cx="${c.x(q).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${q===sel?5:3.5}" fill="${CX_NEG}" stroke="#fff" stroke-width="1.2"><title>${qLong(q)} · running total ${sr(v)}</title></circle>`;});
  cum+=T(c.x(pk),y(-S.peak)-14,`Deepest: −${rc(S.peak)} in ${qName(pk)}`,'slab-b',pk>11?'end':'middle',`font-size:13px;fill:${CX_NEG};${halo}`);
  if(S.back>0)cum+=T(c.x(S.back)-c.slot/2-8,y0-10,`Back above zero in ${qName(S.back)}`,'slab-b','end',`font-size:12.5px;${halo}`);
  /* step 5: cash in the bank — each round lifts the line */
  const raised=q=>sum(R.rounds.filter(r=>r.q===q).map(r=>r.amt));let cp=start,arrows='';
  for(let q=0;q<N;q++){const x=c.x(q),a=raised(q),v=S.cash[q];
    if(a>0){cp+=`L${x.toFixed(1)} ${y(v-a).toFixed(1)}L${x.toFixed(1)} ${y(v).toFixed(1)}`;const i=R.rounds.findIndex(r=>r.q===q);
      arrows+=`<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${y(v-a).toFixed(1)}" y2="${(y(v)+5).toFixed(1)}" stroke="${ACCENT}" stroke-width="4" marker-end="url(#cxarr${id})"/>`+T(x,y(v)-26,`Round ${i+1}`,'slab-b','middle',`font-size:12.5px;fill:${ACCENT_TXT};${halo}`)+T(x,y(v)-11,`+₹${f0(a)} Cr`,'slab-b','middle',`font-size:12.5px;fill:${ACCENT_TXT};${halo}`);}
    else cp+=`L${x.toFixed(1)} ${y(v).toFixed(1)}`;}
  const yb=y(P.buffer);
  let cash=`<line x1="${c.ml}" x2="${c.ml+c.pw+4}" y1="${yb.toFixed(1)}" y2="${yb.toFixed(1)}" stroke="${ACCENT}" stroke-width="1.5" stroke-dasharray="6 4"/>`+T(c.ml+c.pw+8,yb-2,`₹${f0(P.buffer)} Cr`,'slab-b','',`font-size:12px;fill:${ACCENT_TXT}`)+T(c.ml+c.pw+8,yb+12,'floor','slab-b','',`font-size:12px;fill:${ACCENT_TXT}`)
   +`<path d="${cp}" fill="none" stroke="${CX_CASH}" stroke-width="2.5" stroke-linejoin="round"/>`;
  S.cash.forEach((v,q)=>{cash+=`<circle cx="${c.x(q).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${q===sel?5:3.5}" fill="${CX_CASH}" stroke="#fff" stroke-width="1.2"><title>${qLong(q)} · cash at the end: ${sr(v)}</title></circle>`;});
  cash+=arrows+T(c.x(R.minQ),y(R.minCash)+20,`lowest`,'smut','middle',`font-size:11px;${halo}`);
  /* the value row: one number per quarter for the layer on show */
  const nv=v=>({t:nlab(v),c:v<-0.05?ACCENT_TXT:''});
  const rows=ly('0','',cxRow(c,S.net.map(v=>({t:nlab(v)})),['Revenue','/ month'],sel))+ly('1','',cxRow(c,Q.map(w=>({t:pctR(w.patP),c:w.pat<0?ACCENT_TXT:''})),['Op. profit','margin'],sel))
   +ly('2','',cxRow(c,S.ncf.map(nv),['Net cash','flow'],sel))+ly('3','',cxRow(c,S.cum.map(nv),['Running','total'],sel))+ly('4','',cxRow(c,S.cash.map(nv),['Cash in','the bank'],sel));
  let s=`<defs><clipPath id="cxneg${id}"><rect x="0" y="${y0.toFixed(1)}" width="${W}" height="${Math.max(0,c.top+c.h+6-y0).toFixed(1)}"/></clipPath><marker id="cxarr${id}" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${ACCENT}"/></marker></defs>`;
  s+=cxBand(c,sel)+ax.svg;
  s+=ly('0','',tot)+ly('1','2',costs)+ly('1','',pats)+ly('1','',burn)+ly('2','3',cashPats)+ly('2','3',cashBurn)+ly('2','3',spend)+ly('3','',cum)+ly('4','',cash)+ly('1','',marginNotes)+rows;
  s+=cxAxisX(c,sel)+T(c.ml-8,c.top-12,'₹ Cr','smut','end','font-size:11px')+cxHits(c,'selq');
  return `<svg class="s-svg cx-svg" viewBox="0 0 ${W} ${c.H}" role="img" aria-label="Revenue, Operating profit, growth spending, running total and cash by quarter">${s}</svg>`;
}

/* step 6: what the first investor's stake is worth at an exit in each quarter */
function cxRet(W,D){
  const c=cxFrame(W,cxH()),path=D.ret.path,q0=D.X.q,ask=D.pr[0].amt,bw=Math.min(36,c.slot*.6);
  const ax=axisY(c,0,Math.max(...path,ask)*1.08,{n:5}),y=ax.y;let s=cxBand(c,q0)+ax.svg;
  path.forEach((v,q)=>{s+=`<rect x="${(c.x(q)-bw/2).toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(y(0)-y(v),.5).toFixed(1)}" rx="2" fill="${CX_VALUE}" stroke="${q===q0?CX_VALUE:'none'}" stroke-width="${q===q0?2:0}"><title>${qLong(q)} · stake worth ${rc(v)} (${xS(v/ask)})</title></rect>`;});
  s+=`<line x1="${c.ml}" x2="${c.ml+c.pw+4}" y1="${y(ask).toFixed(1)}" y2="${y(ask).toFixed(1)}" stroke="${ACCENT}" stroke-width="1.5" stroke-dasharray="6 4"/>`+T(c.ml+c.pw+8,y(ask)-2,`₹${f0(ask)} Cr`,'slab-b','',`font-size:12px;fill:${ACCENT_TXT}`)+T(c.ml+c.pw+8,y(ask)+12,'put in','slab-b','',`font-size:12px;fill:${ACCENT_TXT}`);
  s+=cxRow(c,path.map(v=>({t:xS(v/ask)})),['Multiple','of ₹'+f0(ask)+' Cr'],q0);
  s+=cxAxisX(c,q0)+T(c.ml-8,c.top-12,'₹ Cr','smut','end','font-size:11px')+cxHits(c,'exitq');
  return `<svg class="s-svg cx-svg" viewBox="0 0 ${W} ${c.H}" role="img" aria-label="Value of the first investor's stake by exit quarter">${s}</svg>`;
}

/* step 7: return on capital employed */
function cxRoce(W,D){
  const c=cxFrame(W,cxH()),ro=roceFin(D.G),sel=selQ(),lo=Math.min(0,...ro.map(r=>Math.min(r.pre,r.post)*100)),bw=Math.min(36,c.slot*.6),cl=v=>v*100;
  const ax=axisY(c,lo,Math.max(...ro.map(r=>r.pre*100))*1.08,{n:7,fmt:v=>(v<0?'−':'')+fd(Math.abs(v),0)+'%'}),y=ax.y;let s=cxBand(c,sel)+ax.svg;
  ro.forEach((r,q)=>{const v=cl(r.pre),x=c.x(q);s+=`<rect x="${(x-bw/2).toFixed(1)}" y="${y(Math.max(0,v)).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(Math.abs(y(v)-y(0)),.6).toFixed(1)}" rx="2" fill="${CX_PAT}" stroke="${q===sel?CX_PAT:'none'}" stroke-width="${q===sel?2:0}"><title>${qLong(q)} · ${pct1(r.pre*100)} before depreciation, ${pct1(r.post*100)} after</title></rect>`;
    s+=`<circle cx="${x.toFixed(1)}" cy="${y(cl(r.post)).toFixed(1)}" r="3.5" fill="#fff" stroke="${CX_PAT}" stroke-width="1.5"/>`;});
  s+=cxRow(c,ro.map(r=>({t:pctR(r.pre*100),c:r.pre<0?ACCENT_TXT:''})),['Return','pre-tax'],sel);
  s+=cxAxisX(c,sel)+cxHits(c,'selq');
  return `<svg class="s-svg cx-svg" viewBox="0 0 ${W} ${c.H}" role="img" aria-label="Operating return on capital by quarter">${s}</svg>`;
}

/* chart titles, the one line on how to read each, and the key — one per step */
function cxHeads(D){
  const ask=f0(D.pr[0].amt),fl=f0(D.R.P.buffer);
  return [
   ['Net revenue, quarter by quarter','Every step on this page builds on this one chart: same quarters, same ₹ Cr scale. The row under the bars gives each quarter’s figure; click a quarter for its working on the right.'],
   ['Where each quarter’s revenue goes','The same bars, split into costs. What is left at the bottom, in black, is Operating profit; the row gives the Operating profit margin.'],
   ['Operating profit against growth spending','Costs fade. Above the line, Operating profit; below it, what growth spends that quarter. The row is Operating profit less spending: orange when the quarter is short of cash.'],
   ['Running total: how far short of cash the business gets','The line adds up step 3’s row, quarter after quarter. The shaded area under zero is what outside money has to fill.'],
   ['Projected cash balance',`Cash remaining after investment, equity and debt.`],
   [`Potential investor return`,`Exit equity value × ownership after dilution. Exit equity value includes projected cash less outstanding debt.`],
   ['Return on capital employed, quarter by quarter','A new scale: a year of Operating profit at that quarter’s rate, as a share of all the capital tied up so far. The dots take depreciation off first.']];
}
function cxLegends(D){
  const i=(c,l,x='')=>`<span>${swc(c,x)}${l}</span>`,ln=(st,l)=>`<span><i class="ln" style="${st}"></i>${l}</span>`;
  return [
   i(CX_REV,'Net revenue'),
   i(CX_PAT,'Operating profit')+i(CX_FIX,'Fixed costs')+i(CX_VAR,'Variable costs')+i(CX_COGS,'Materials (COGS)')+i(ACCENT,'Burn: Operating profit below zero'),
   i(CX_PAT,'Operating profit')+i(CAP4C.capex,'Capex')+i(CAP4C.pp,'Intangibles')+i(CAP4C.wc,'Working capital')+i('#E9E6DE','Costs, faded'),
   ln(`border-top:2.5px solid ${ACCENT_TXT}`,'Running total of Operating profit less spending')+i(CX_HOLE,'Short of cash','outline:1px solid #F0C9B8')+i('#E9E6DE','Step 3, faded'),
   ln(`border-top:2.5px solid ${CX_PAT}`,'Cash in the bank')+i(ACCENT,'A round coming in')+ln(`border-top:1.5px dashed ${ACCENT}`,`₹${f0(D.R.P.buffer)} Cr floor`)+ln(`border-top:1.6px dashed ${CX_GREY}`,'With no raises'),
   i(CX_REV,'Stake value at that exit')+i(ACCENT,'Exit you picked')+ln(`border-top:1.5px dashed ${ACCENT}`,`₹${f0(D.pr[0].amt)} Cr put in`),
   i(CX_REV,'Before depreciation')+`<span><i class="dot o"></i>After depreciation</span><span class="lg-n">bars stop at −40%</span>`];
}

/* ---------- the right-hand panel: the working for the quarter you pick, and what would change it ---------- */
function cxCalc(rows){return `<div class="cx-calc">${rows.map(([op,col,lb,sm,v,cls])=>`<div class="cl${cls?' '+cls:''}"><span class="op">${op||''}</span><span class="lb">${col?swc(col):'<i class="sw nil"></i>'}<span>${lb}${sm?`<small${sm[0]==='~'?' class="opt"':''}>${sm[0]==='~'?sm.slice(1):sm}</small>`:''}</span></span><span class="v">${v}</span></div>`).join('')}</div>`;}
function cxQ(q,key='selq',lab='Worked out for'){return `<div class="cx-qh"><span class="cx-sub">${lab}</span><div class="cx-qn"><button type="button" data-cap="${key}:${Math.max(0,q-1)}"${q<=0?' disabled':''} aria-label="Previous quarter">‹</button><b>${qName(q)}</b><span>${LAB[q]}</span><button type="button" data-cap="${key}:${Math.min(15,q+1)}"${q>=15?' disabled':''} aria-label="Next quarter">›</button></div></div>`;}
function cxCols(rows,sel=selQ()){const qs=[...new Set([...KEYQ,sel])].sort((a,b)=>a-b);
  return `<table class="cx-cols"><thead><tr><th></th>${qs.map(q=>`<th class="${q===sel?'on':''}">${qName(q)}</th>`).join('')}</tr></thead><tbody>${rows.map(([l,f,cls])=>`<tr class="${cls||''}"><th>${l}</th>${qs.map(q=>`<td class="${q===sel?'on':''}">${f(q)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;}
function cxLev(title,rows,note){return `<div class="cx-lev"><p class="cx-sub">${title}</p>${rows.map(([l,v,d])=>`<div class="lv"><span>${l}</span><b>${v}</b><em>${d||''}</em></div>`).join('')}${note?`<p class="cx-note">${note}</p>`:''}</div>`;}
const dlt=(v,base,fmt=rc)=>{const d=v-base;return Math.abs(d)<0.05?'no change':(d>0?'+':'−')+fmt(Math.abs(d));};
const CX={};

CX.rev=D=>{
  const S=cxSeries(D),Q=S.Q,q=selQ(),w=Q[q],M=D.B.V.M,L=p=>MODEL.products[p].launch,lines=['tile','niche','wood','upvc','p5'],tot=D.T[q];
  const city=view(SCOPE.core,'city').T[q],dist=view(SCOPE.core,'dist').T[q],uc=unitsBy('city',q),ud=unitsBy('dist',q);
  const lead=`Net revenue grows from <b>${rc(Q[0].net)}</b> a quarter to <b>${rc(Q[15].net)}</b> as cities and dealer zones open and wood adhesive (Q${L('wood')}), uPVC (Q${L('upvc')}) and waterproofing (Q${L('p5')}) launch. It is page 02’s plan, per quarter and net of GST.`;
  const calc=cxCalc([['',null,'Revenue a month, quarter end · page 02','',rc(tot)],['×',null,'3 months: gross revenue','',rc(w.gross)],['−',null,`GST (gross ÷ ${fd(w.gross/w.net,1)})`,'',rc(w.gst)],['=',CX_REV,`Net revenue in ${qName(q)}`,'',rc(w.net),'tot']]);
  const mix=`<p class="cx-sub">Where ${qName(q)} revenue comes from</p><div class="cx-mix"><div class="bar">${lines.map(p=>`<i style="flex:${Math.max(M[p][q],0.0001)};background:${COLORS[p]}" title="${SH[p]}: ${rc(M[p][q])} a month"></i>`).join('')}</div><div class="lg">${lines.filter(p=>M[p][q]>0.001).map(p=>`<span>${swc(COLORS[p])}${SH[p]}<b>${Math.round(M[p][q]/tot*100)}%</b></span>`).join('')}</div><p class="cx-note">Cities ${Math.round(city/tot*100)}%, dealer zones ${Math.round(dist/tot*100)}% · ${fd(uc,uc%1?1:0)} cities and ${fd(ud,ud%1?1:0)} dealer zones open</p></div>`;
  const late=q>=2?Q[q-2].net:null;
  return {lead,body:cxQ(q)+calc+mix+cxLev(`${qName(q)} net revenue if…`,[['Revenue runs two quarters late',late!=null?rc(late):'–',late!=null?dlt(late,w.net):''],['70% of the plan is achieved',rc(w.net*.7),dlt(w.net*.7,w.net)]],`${capLink('basis','How each unit is built · 01')}${capLink('cities','City by city · 04')}${capLink('products','Line by line · 05')}`)};

  const lead=`Operating profit margin climbs from <b>${pct1(f.patP)}</b> to <b>${pct1(l.patP)}</b>, mostly because fixed costs grow far slower than revenue. Burn, Operating profit below zero, is limited to ${pos>1?`Q1–${qName(pos-1)}`:'Q1'}: ${rc(burn)} in all.`;

  const cols=cxCols([['Materials',r=>pctR(Q[r].cogsP)],['Variable',r=>pctR(Q[r].varP)],['Fixed',r=>pctR(Q[r].fixP)],['Operating profit margin',r=>pctR(Q[r].patP),'b']]);
  const all=sum(S.net);
  return {lead,body:cxQ(q)+calc+`<p class="cx-sub">Share of net revenue</p>`+cols+cxLev(`${qName(q)} Operating profit if…`,[['Materials cost 1 point more',sr(w.pat-w.net*.01),`${dlt(w.pat-w.net*.01,w.pat)} · ${rc(all*.01)} over 4 years`],['Fixed costs are 20% higher',sr(w.pat-w.fixed*.2),dlt(w.pat-w.fixed*.2,w.pat)]],capLink('audit','Full P&L and margin bridge · 06'))};
};

CX.spend=D=>{
  const S=cxSeries(D),G=D.G,K=G.K,q=selQ(),fl=S.fl,c16=K.cum[15],tot=c16.capex+c16.pp+c16.wc,X=K.X,C=INP.capital,fp=f0(C.firstPhase);
  const dM=D.T[q]-(q?D.T[q-1]:INP.valuation.todayMRR),days=K.days(D.T[q]),glide=INP.funding.wcBasis;
  const lead=`Growth ties up <b>${rc(tot)}</b> by Q16, and ${Math.round(c16.wc/tot*100)}% of it is receivables. Until ${qName(S.cross-1)} each quarter spends more than Operating profit brings in; from ${qName(S.cross)}, Operating profit covers it.`;
  const calc=cxCalc([['',CX_PAT,'Operating profit','',sr(S.pat[q])],['−',CAP4C.capex,'Capex','~plants, experience centres, misc',rc(fl.capex[q])],['−',CAP4C.pp,'Intangibles','~labs, systems',rc(fl.pp[q])],['−',CAP4C.wc,'Working capital',`${glide?'':`${f0(days)} days of `}receivables on ${rc(dM)} more revenue a month`,rc(fl.wc[q])],['=',S.ncf[q]<0?ACCENT:CX_PAT,S.ncf[q]<0?`${qName(q)} is short`:`${qName(q)} has left over`,'',rc(Math.abs(S.ncf[q])),'tot']]);
  const rules=`<p class="cx-sub">How each is sized · total by Q16</p><table class="cx-rules"><tr><th>${swc(CAP4C.wc)}Working capital</th><td>${glide?`cash cycle ${fd(INP.cash.cycleToday,0)} → ${fd(INP.cash.cycleTarget,1)} days`:`${f0(C.wcDays)} days: ₹${fd(C.wcDays/30,2)} per ₹1 of monthly revenue added`}${fn(NOTE_WC)}</td><td>${rc(c16.wc)}</td></tr>
   <tr><th>${swc(CAP4C.capex)}Capex</th><td>plants ₹${f0(X.tileP5+X.wood+X.upvc)} Cr (wood and uPVC ${fp}% a quarter before launch), ${C.centresN} centres, misc${fn(NOTE_PLANT)}</td><td>${rc(c16.capex)}</td></tr>
   <tr><th>${swc(CAP4C.pp)}Intangibles</th><td>labs with the plants, systems with revenue</td><td>${rc(c16.pp)}</td></tr></table><p class="cx-note">The key figure of ₹${f0(G.cumTot[15])} Cr adds the cost plan’s ${rc(c16.loss)} of early burn.${fn(NOTE_PLAN)}</p>`;
  const tf=o=>gapFin(o).capx[15],v45=tf({capital:{wcDays:45},wcBasis:0}),v90=tf({capital:{wcDays:90},wcBasis:0}),vp=tf({plantMult:1.2});
  return {lead,body:cxQ(q)+calc+rules+cxLev('Growth spending by Q16 if…',[['Receivables run 45 days',rc(v45),dlt(v45,tot)],['Receivables run 90 days',rc(v90),dlt(v90,tot)],['Plants cost 20% more',rc(vp),dlt(vp,tot)]])};
};

function cxRange(rows,base,fmt){ /* one line per assumption: the kind case, the plan, the hard case */
  const vs=rows.flatMap(r=>r.v.map(x=>x[1])).concat(base),lo=Math.min(...vs),hi=Math.max(...vs),sp=hi-lo||1,px=v=>((v-lo)/sp*100).toFixed(1)+'%';
  return `<div class="cx-rng">${rows.map(r=>{const a=Math.min(base,...r.v.map(x=>x[1])),b=Math.max(base,...r.v.map(x=>x[1]));return `<div class="rg"><span class="rl">${r.label}<small>plan: ${r.plan}</small></span><span class="tr"><i class="sg" style="left:${px(a)};width:${((b-a)/sp*100).toFixed(1)}%"></i><i class="bs" style="left:${px(base)}"></i>${r.v.map(([l,v])=>`<i class="pt ${v>base?'up':'down'}" style="left:${px(v)}"></i><em class="${v>base?'up':'down'}" style="left:${px(v)}">${l}: ${fmt(v)}</em>`).join('')}</span></div>`;}).join('')}</div>`;
}
CX.need=D=>{
  const S=cxSeries(D),G=D.G,K=G.K,q=selQ(),spentTo=K.cum[q].capex+K.cum[q].pp+K.cum[q].wc,patTo=G.cumPat[q],C=INP.capital;
  const lead=`The business is <b>${rc(S.peak)}</b> short of cash at its deepest, in ${qName(S.pk)} (${LAB[S.pk]}). After that Operating profit outruns spending, and the running total is back above zero in ${qName(S.back)}. This hole, plus a cash cushion, is what the raises must fill.`;
  const calc=cxCalc([['',CAP4C.capex,'Growth spending so far',`~capex, intangibles, working capital · Q1–${qName(q)}`,rc(spentTo)],['−',CX_PAT,'Operating profit earned so far',`Q1–${qName(q)}`,sr(patTo)],['=',S.cum[q]<0?ACCENT:CX_PAT,S.cum[q]<0?`Short at the end of ${qName(q)}`:`Ahead at the end of ${qName(q)}`,`~${qName(q)} itself: ${sr(S.ncf[q])}`,rc(Math.abs(S.cum[q])),'tot']]);
  const pk=o=>gapFin(o).peak;
  const rows=[{label:'Receivables',plan:`${f0(C.wcDays)} days`,v:[['45 days',pk({capital:{wcDays:45},wcBasis:0})],['90 days',pk({capital:{wcDays:90},wcBasis:0})]]},
   {label:'Plants before launch',plan:`${f0(C.firstPhase)}% built`,v:[['0%',pk({capital:{firstPhase:0}})],['100%',pk({capital:{firstPhase:100}})]]},
   {label:'Plant cost',plan:'founders’ estimate',v:[['−20%',pk({plantMult:.8})],['+20%',pk({plantMult:1.2})]]},
   {label:'Revenue timing',plan:'on time',v:[['2 qtrs late',pk({lateQ:2})]]}];
  return {lead,body:cxQ(q)+calc+`<div class="cx-lev"><p class="cx-sub">Deepest point if one assumption changes</p>${cxRange(rows,S.peak,v=>'₹'+f0(v))}<p class="cx-note">The black tick is this plan’s ${rc(S.peak)}; orange is a deeper hole. Receivable days move it most.</p></div>`};
};

CX.raise=D=>{
  const R=D.R,G=D.G,K=G.K,P=R.P,rs=R.rounds,N=R.N,S=cxSeries(D),q=selQ();
  const amt=rs.map((r,i)=>`<b>₹${f0(r.amt)} Cr</b> ${i?`in ${qName(r.q)}`:'now'}`).join(' and ');
  const lead=`${['One round','Two rounds','Three rounds','Four rounds'][rs.length-1]||rs.length+' rounds'}, ${amt}, fill the ${rc(S.peak)} hole and keep ₹${f0(P.buffer)} Cr in hand. Cash is lowest in ${qName(R.minQ)}, at <b>${rc(R.minCash)}</b>, and reaches ${rc(R.cash[N-1])} by Q16.`;
  const rule=`<p class="cx-note cx-rulen"><b>The rule:</b> Close a round ${P.lead} quarter${P.lead>1?'s':''} before cash would fall below ₹${f0(P.buffer)} Cr; size it to the deepest point of the next ${P.window} quarters plus ₹${f0(P.buffer)} Cr, less what is already raised, rounded up to ₹${f0(P.roundTo)} Cr.${fn(NOTE_FUND)}</p>`;
  const card=(r,i)=>{const nx=rs[i+1],qa=i?Math.max(0,rs[i-1].breach):0,qb=nx&&r.breach>0?r.breach-1:Math.max(qa,G.peakQ),d=k=>K.cum[qb][k]-(qa?K.cum[qa-1][k]:0),pe=G.cumPat[qb]-(qa?G.cumPat[qa-1]:0);
    const why=i?`deepest point ${rc(r.need)} (${qName(r.needQ)}) + ₹${f0(P.buffer)} Cr − ₹${f0(r.raised)} Cr raised = ${rc(r.raw)}, rounded up`:'the ask';
    const when=i?`cash would go under ₹${f0(P.buffer)} Cr in ${qName(r.trigger)}`:'it opens the plan';
    return `<div class="cx-rd"><p class="h"><span>Round ${i+1} · ${qName(r.q)}</span><b>₹${f0(r.amt)} Cr</b></p><dl><div><dt>Why this much</dt><dd>${why}</dd></div><div><dt>Why then</dt><dd>${when}</dd></div><div><dt>Pays for, ${qName(qa)}–${qName(qb)}</dt><dd>capex ${rc(d('capex'))}, working capital ${rc(d('wc'))}, intangibles ${rc(d('pp'))}; Operating profit adds ${sr(pe)}</dd></div></dl></div>`;};
  const st=q?S.cash[q-1]:0,ra=sum(rs.filter(r=>r.q===q).map(r=>r.amt)),oth=S.cash[q]-st-S.ncf[q]-ra;
  const qline=`<p class="cx-qline"><b class="qn">${qName(q)}:</b> cash ${sr(st)} at the start ${S.ncf[q]<0?'−':'+'} ${rc(Math.abs(S.ncf[q]))} Operating profit less spending${ra?` + ${rc(ra)} raised`:''}${Math.abs(oth)>0.05?` ${oth<0?'−':'+'} ${rc(Math.abs(oth))} debt, net`:''} = <b>${sr(S.cash[q])}</b> at the end.</p>`;
  const SL={d90:'Receivables at 90 days',pl20:'Plants cost 20% more',pre100:'Plants fully built before launch',late2:'Revenue two quarters late'};
  const cases=stressCases().filter(c=>c.toggle).map(c=>{const x=stressRun(c,R),out=x.fixed.cash.findIndex(v=>v<-1e-9);return [SL[c.k]||c.label,rc(x.equity),out>=0?`out of cash in ${qName(out)} on ${rs.length} rounds`:'covered'];});
  const dp=raisePlan({funding:{debtCapex:50,debtWC:50}});
  return {lead,body:`<div class="cx-rds">${rs.map(card).join('')}</div>`+rule+qline+cxLev('Equity needed if…',[...cases,['Half of plants and receivables on debt',rc(dp.equity),`${dp.rounds.length} round${dp.rounds.length>1?'s':''} · ${rc(dp.D.cumInt[N-1])} interest`]],`Debt rates are placeholders until lenders quote.${fn(NOTE_DEBT)}`)};
};

const RET_M=[['arr-10','10× ARR'],['arr-2','2× ARR'],['arr-3','3× ARR'],['arr-5','5× ARR'],['pat',null],['model','Round-pricing method']];
CX.ret=D=>{
  const R=D.R,X=D.X,ret=D.ret,pr=ret.pr,q=X.q,e=pr[0],Fd=INP.funding,cur=X.m==='arr'?`arr-${X.mult}`:X.m,lbl=k=>k==='pat'?`${f0(Fd.multPat)}× Operating profit`:(RET_M.find(x=>x[0]===k)||[0,`${X.mult}× ARR`])[1];
  const later=pr.filter((r,i)=>i>0&&r.q<=q),back=ret.path.findIndex(v=>v>=e.amt),arr=12*D.T[q]*X.ach,pat4=12*R.G.patMonthly[q]*X.ach;
  const ctl=`<div class="cx-ctl"><span>Exit valued at</span>${seg(RET_M.map(([k])=>[k,lbl(k)]),cur,'exitm','Exit valued at')}<span>Exit revenue vs plan</span>${seg([[1,'100%'],[0.7,'70%'],[0.5,'50%']],X.ach,'ach','Share of the revenue plan achieved')}</div>`;
  const lead=`Exit in ${qName(q)} at ${lbl(cur)}: the first ₹${f0(e.amt)} Cr is worth <b>${rc(ret.val)}</b>, ${xS(ret.mult)} the money or ${pct1(ret.irr*100)} a year.${back>=0?` The stake is worth more than what was put in from ${qName(back)}.`:''}`;
  const worth=X.m==='pat'?`annualised Operating profit ${rc(pat4)} × ${f0(Fd.multPat)}`:X.m==='model'?`ARR ${rc(arr)} at the round method’s ${xS(multArrAt(q))}${blendW(q,R)>0.001?`, part on ${f0(Fd.multPat)}× Operating profit`:''}`:`ARR ${rc(arr)} × ${X.mult}`;
  const calc=cxCalc([['',ACCENT,'Round 1 buys',`${rc(e.amt)} at ${rc(e.post)} post-money = ${xS(e.mArr)} today’s ARR of ${rc(e.arr)}${fn(NOTE_PRICE)}`,pct2(e.stake)],
    ...later.map(r=>['×',null,`Round ${pr.indexOf(r)+1} dilutes`,`${rc(r.amt)} at ${rc(r.post)} post-money = ${xS(r.mArr)} ARR of ${rc(r.arr)}${r.w>0.001?`, ${Math.round(r.w*100)}% on Operating profit`:''}; you keep ${rc(r.pre)} ÷ ${rc(r.post)}`,pct2(r.pre/r.post)]),
    ['=',null,`Your stake at ${qName(q)}`,'',pct2(ret.s),'sub'],
    ['×',null,'What all of Tejas is worth',`${worth} + cash ${rc(ret.cash)}${ret.debt>0.005?` − debt ${rc(ret.debt)}`:''}`,rc(ret.eqv)],
    ['=',ACCENT,`₹${f0(e.amt)} Cr becomes`,`${xS(ret.mult)} · IRR ${pct1(ret.irr*100)} over ${fd(ret.yrs,ret.yrs%1?2:0)} years${fn(NOTE_RET)}`,rc(ret.val),'tot']]);
  const rows=RET_M.filter(([k])=>k!==cur).map(([k])=>{const [m,x]=k.split('-'),r=investorReturn(R,{q,m,mult:x?+x:undefined,ach:X.ach});return [k==='model'?'On the round method':`At ${lbl(k)}`,rc(r.val),`${xS(r.mult)} · IRR ${pct1(r.irr*100)}`];});
  return {lead,pre:ctl,body:cxQ(q,'exitq','Exit in')+calc+cxLev(`The same ${qName(q)} exit, valued other ways`,rows)};
};

CX.roce=D=>{

  const lead=`By Q16, every ₹100 tied up in plants, labs and receivables earns <b>₹${f0(l.pre*100)}</b> a year before depreciation (₹${f0(l.post*100)} after). Capital goes in ahead of the sales it serves, so ROCE starts low and climbs as revenue fills the plants.`;
  const calc=cxCalc([['',CX_PAT,'Operating profit a year',`${qName(q)} monthly operating profit ${sr(pat)} × 12`,sr(12*pat)],['÷',null,'Capital employed',`capex ${rc(c.capex)} + intangibles ${rc(c.pp)} + working capital ${rc(c.wc)}`,rc(r.ce)],['=',ACCENT,'Return before depreciation','annualised profit ÷ gross modelled capital',pct1(r.pre*100),'tot'],['',null,'After depreciation',`${rc(4*r.dep)} a year off: plants and centres over ${f0(F.lifePlant)} years, the rest over ${f0(F.lifeOther)}${fn(NOTE_RET)}`,pct1(r.post*100),'sub']]);
  const cols=cxCols([['Before depreciation',t=>pctR(ro[t].pre*100),'b'],['After',t=>pctR(ro[t].post*100)]]);
  const rq=o=>roceFin(gapFin(o))[15].pre*100,v45=rq({capital:{wcDays:45},wcBasis:0}),v90=rq({capital:{wcDays:90},wcBasis:0}),vp=rq({plantMult:1.2}),pts=x=>fd(x,1)+' pts';
  return {lead,body:cxQ(q)+calc+`<p class="cx-sub">Key quarters</p>`+cols+cxLev('Q16 capital return if…',[['Receivables run 45 days',pct1(v45),dlt(v45,l.pre*100,pts)],['Receivables run 90 days',pct1(v90),dlt(v90,l.pre*100,pts)],['Plants cost 20% more',pct1(vp),dlt(vp,l.pre*100,pts)]])};
};

/* ---------- the page ---------- */
function capKPI(D){

const pcPolicy=fundPolicy;
fundPolicy=function(o={}){

    r3Q:qi(P.r3Q??F.r3Q,7),r3Usd:num(P.r3Usd??F.r3Usd,50),r4Q:qi(P.r4Q??F.r4Q,11),r4Usd:num(P.r4Usd??F.r4Usd,175),fx:num(P.fx??F.fx,88,1e-9)||88,roundMult:num(P.roundMult??F.roundMult,10,1e-9)||10};

/* Four rounds. Round 1 = the ask (Q1). Round 2 = fixed amount at a fixed quarter (round2 = 0 sizes it by the cash rule instead).
   Rounds 3-4 = acquisition rounds in US$. o.rounds (stress runs) overrides the list; the cash rule never moves a round. */
raisePlan=function(o={}){
  const G=gapFin(o),N=G.N,P=fundPolicy(o),D=debtFin(G,P),base=G.gap.map((g,q)=>-g+D.bal[q]-D.cumInt[q]),fx=P.fx;
  const up=x=>Math.max(P.roundTo,Math.ceil(x/P.roundTo-1e-9)*P.roundTo),cl=q=>Math.max(0,Math.min(N-1,q));
  let rounds;
  if(o.rounds)rounds=o.rounds.map((r,i)=>({n:r.n??i+1,q:r.q,amt:r.amt,kind:r.kind||(i===0?'ask':'organic'),...(r.usd!=null?{usd:r.usd}:{})}));
  else{
    const r1={n:1,q:0,amt:P.e1,kind:'ask'},only1=q=>q>=0?P.e1:0;
    /* diagnostic only: what the cash rule alone would ask for round 2 */
    let raw=0,trig=-1,need=0,needQ=-1;
    for(let q=0;q<N;q++)if(only1(q)+base[q]<P.buffer-1e-9){trig=q;break;}
    if(trig>=0){const close=Math.max(trig-P.lead,1);let m=Infinity,t=close;for(let q=close;q<=Math.min(close+P.window-1,N-1);q++){const c=only1(q)+base[q];if(c<m-1e-12){m=c;t=q;}}raw=P.buffer-m;need=-base[t];needQ=t;}

      {n:3,q:cl(P.r3Q),amt:P.r3Usd*fx/10,usd:P.r3Usd,kind:'acq'},{n:4,q:cl(P.r4Q),amt:P.r4Usd*fx/10,usd:P.r4Usd,kind:'acq'}];
  }

    organic:{equity:sum(org.map(r=>r.amt)),cash:oc,minCash:om,minQ:oc.indexOf(om)},acq:{amt:sum(acqR.map(r=>r.amt)),usd:sum(acqR.map(r=>r.usd||0))},fx};

/* Round 1 = 16x today's ARR post-money. Rounds 2-4: pre-money = roundMult x ARR at the round's quarter (12 x quarter-end monthly revenue).

priceRounds=function(R,over){
  const F=INP.funding,T=baseData().V.T,mult=R.P?.roundMult??+F.roundMult??10;let stake=0,prev=null;
  return R.rounds.map((r,k)=>{
    const n=r.n??k+1,kind=r.kind||(k?'organic':'ask');let e;
    if(!k){const arr=INP.valuation.todayMRR*12,post=INP.valuation.multiple*arr,pre=post-r.amt;stake=r.amt/post;
      e={...r,k,n,kind,name:'E1',arr,mArr:INP.valuation.multiple,w:0,marg:null,arrVal:post,patVal:0,pre,post,sold:stake,dil:0,stake,stepUp:null,method:fd(INP.valuation.multiple,0)+'× ARR'};}
    else{const q=r.q,arr=12*T[q],pre=over&&over[k]!=null?over[k]:mult*arr,post=pre+r.amt,dil=r.amt/post;stake*=pre/post;

};

exitEV=function(q,X,R){const F=INP.funding;return Math.max(0,X.m==='pat'?12*R.G.patMonthly[q]*F.multPat:(X.mult??10)*12*baseData().V.T[q]);};

  const rq=o=>roceFin(gapFin(o))[15].pre*100,v45=rq({capital:{wcDays:45}}),v90=rq({capital:{wcDays:90}}),vp=rq({plantMult:1.2}),pts=x=>fd(x,1)+' pts';
  const c1=pcCard('How the return is measured · Q16',pcEq([['Operating profit a year',rc(12*m),'',PC.profit],'÷',['Capital employed',rc(l.ce),'',PC.capex],'=',['Return',pctR(l.pre*100),'res',PC.profit]])+pcEq([['− Depreciation a year',rc(4*l.dep)],'→',['After depreciation',pctR(l.post*100),'res',PC.profit]]),`Annual operating profit is 12 × the quarter’s monthly profit. Depreciation is straight line: plants and centres over ${f0(F.lifePlant)} years, labs, systems and misc over ${f0(F.lifeOther)}.${fn(NOTE_RET)}`,PC.profit);
  const c2=pcCard('What counts as capital employed',pcStrip([{v:c.capex,c:PC.capex,t:`Capex ${fd(c.capex,0)}`,min:.12},{v:c.pp,c:PC.labs,tc:PC.ink,t:`${fd(c.pp,0)}`,min:.05},{v:K.wcTotal[15],c:PC.wc,tc:PC.ink,t:`Working capital ${fd(K.wcTotal[15],0)}`,min:.12}])+pcLg([[PC.capex,'Capex: plants, centres, misc'],[PC.labs,'Labs / systems'],[PC.wc,`Working-capital target (${fd(K.days(),0)} days)`]]),`₹ Cr at Q16: the cumulative spend to date plus the full working-capital target, including its opening balance. Existing fixed assets are not in the books supplied, so they are left out.`,PC.capex);
  const c3=pcCard('Why it starts low',pcSpark(ro.map(r=>r.pre*100),{h:58,col:PC.profit,area:pcTint(PC.profit,.14),lo:Math.max(-20,Math.min(...ro.map(r=>r.pre*100))),hi:Math.max(...ro.map(r=>r.pre*100)),marks:[...(first>0?[{i:first,t:`positive in ${qName(first)}`,col:PC.profit,dy:-9,a:'start',dx:-6}]:[]),{i:15,t:pctR(l.pre*100),col:PC.profit,dy:-8,dx:-10}],axis:[[0,'Q1'],[7,'Q8'],[15,'Q16']],label:'Return before depreciation by quarter'}),`Plants and working capital are paid ahead of the sales they serve, so capital employed leads profit. Small early balances also give large negative percentages; the chart stops at −20%.`,PC.profit);
  return {lead:'',body:pcCards([c1,c2,c3])
   +pcFold('Sensitivities and caveats',cxLev('Q16 return before depreciation if…',[['Working-capital target is 45 days',pct1(v45),dlt(v45,l.pre*100,pts)],['Working-capital target is 90 days',pct1(v90),dlt(v90,l.pre*100,pts)],['Plants cost 20% more',pct1(vp),dlt(vp,l.pre*100,pts)]])+`<p class="cx-note">A gross-capital proxy, pre-tax, not a complete company ROCE.${fn(NOTE_RET)}</p>`)};

   <div><span>${pcR(ld.amt)} in this round at a ${qName(D.X.q)} exit</span><strong>${pcXh(ld.mult)}<small>${pcR0(ld.val)}</small></strong></div>

  <p class="pc-grp">Funding rounds</p>${grid([['funding.buffer','Minimum closing cash','₹ Cr · quarter-end floor'],['funding.round2','Round 2 amount','₹ Cr · organic growth · 0 = size it by the cash rule'],['funding.round2Q','Round 2 quarter','0-based · 0 = Q1',0,1],['funding.r3Q','Round 3 quarter','0-based · 0 = Q1',0,1],['funding.r3Usd','Round 3 amount','US$ M · acquisitions'],['funding.r4Q','Round 4 quarter','0-based · 0 = Q1',0,1],['funding.r4Usd','Round 4 amount','US$ M · acquisitions'],['funding.fx','Rupees per US$','₹ per $ · ₹ Cr = $M × this ÷ 10'],['funding.roundMult','Round ARR multiple','× the quarter’s ARR · rounds 2 to 4'],['valuation.lead','Lead cheque','₹ Cr · inside the ask'],['funding.multPat','Exit profit multiple','× annual operating profit at the Q16 exit'],['capital.wcDays','Working-capital target','days of annualised revenue'],['capital.firstPhase','Pre-launch plant build','% of wood and uPVC budgets']])}
  <p class="pc-grp">Loan terms <span>(debt is off in this plan; these apply only if it is switched on)</span></p>${grid([['funding.rateCapex','Plant loan rate','% per year · assumption'],['funding.rateWC','Working-capital rate','% per year · assumption'],['funding.moratorium','Plant principal grace','full quarters after draw',0,1],['funding.tenor','Plant amortisation','quarterly instalments after grace',1,1]])}
  ${whyD('Unverified assumptions',financeAssumptions())}</div></details>`;
};

   <div class="cx-plot"><div class="cx-s cx-s-m">${cbox('cx-money',W=>cxMoney(W,D),660)}</div><div class="cx-s cx-s-v">${cbox('cx-val',W=>cxVal(W,D),660)}</div><div class="cx-s cx-s-r">${cbox('cx-ret',W=>cxRet(W,D),660)}</div><div class="cx-s cx-s-o">${cbox('cx-roce',W=>cxRoce(W,D),660)}</div></div>
   <div class="cx-legs">${legs.map((h,i)=>`<div class="cap-legend static cx-leg" data-l="${i}">${h}</div>`).join('')}</div></div>`;
  const dcard=`<div class="s-panel cx-dtcard" data-layer="${cur}"><h3 class="pc-dtt">Data behind the chart</h3><div class="cx-dts">${tb.map((h,i)=>h.replace('class="cx-dt"',`class="cx-dt" data-l="${i}"`)).join('')}</div></div>`;
  const takes=tk.map((t,i)=>`<section class="pc-takes" data-take="${i}"${i===cur?'':' hidden'} aria-label="Key takeaways: ${st[i]}">${t.map(([f,x,c,ct])=>`<article class="pc-take${x==null?' pc-say':''}" style="--c:${c};--ct:${ct}"><b>${f}</b>${x==null?'':`<p>${x}</p>`}</article>`).join('')}</section>`).join('');

/* ---------- one frame for every chart ----------

/* Page 03 right-hand panel kit: the one card anatomy every right-hand panel uses (see panel-kit.css).
   PK.card({title, sub, hero:[figure, unit], body, note, col, hc}) — col is the card's edge colour (its meaning), hc the hero colour if different.
   Body parts: PK.rows([{name, fig, why, sw}]), PK.led([{l, v, tot}]), PK.vis(html). Loaded before panels-b.js and panels-c.js. */
const PK={
  card:o=>`<section class="pc-card pk-card" style="--c:${o.col}${o.hc?`;--hc:${o.hc}`:''}"><h4 class="pk-title">${o.title}</h4>${o.sub?`<p class="pk-sub">${o.sub}</p>`:''}${o.hero?PK.hero(o.hero[0],o.hero[1]):''}${o.body||''}${o.note?`<p class="pk-note">${o.note}</p>`:''}</section>`,
  hero:(fig,unit='')=>`<div class="pk-hero"><b>${fig}</b>${unit?`<span>${unit}</span>`:''}</div>`,
  rows:a=>`<div class="pk-rows">${a.map(r=>`<div class="pk-row"><div class="pk-rh"><span>${r.sw?PK.sw(r.sw):''}${r.name}</span><b>${r.fig}</b></div>${r.why?`<small class="pk-why">${r.why}</small>`:''}</div>`).join('')}</div>`,
  led:a=>`<div class="pk-led">${a.map(r=>`<div class="pk-li${r.tot?' tot':''}"><span>${r.l}</span><b>${r.v}</b></div>`).join('')}</div>`,
  vis:h=>`<div class="pk-vis">${h}</div>`,
  sw:c=>`<i class="pk-sw" style="background:${c}"></i>`
};

/* Page 03, right-hand panels for steps 1 (Revenue), 2 (Margins) and 5 (Investor return).
   Each panel explains the idea in two or three cards (one big figure or one small visual, two short lines at most) and keeps the detail in one fold.
   The charts and their data tables carry the numbers; every number here comes from the model, and none depends on a selected quarter.
   Class prefix: pnb-. */
{
const pnbWords=['no','one','two','three','four','five','six','seven'];
const pnbCap=s=>s.replace(/^./,x=>x.toUpperCase());
const pnbN=(v,d=2)=>String(+(+v).toFixed(d));                                    /* 1 -> "1", 1.72 -> "1.72" */
const pnbPc=v=>Math.abs(v)>=9.95?fd(v,0)+'%':fd(v,1)+'%';                       /* in a card: 10 and over whole, under 10 one decimal */
const pnbP=v=>fd(v,1)+'%';                                                         /* a % of revenue, always one decimal inside a list */
const pnbR=v=>`₹${fd(v,Math.abs(v%1)>1e-9?1:0)} Cr`;
const pnbW=(s,fs,wt)=>typeof pcW==='function'?pcW(s,fs,wt):String(s).length*fs*.6;   /* text width, from the page's own measure */
const pnbF=h=>h.replace('<details class="whyd"','<details class="whyd pnb-fold"');   /* the one fold, tagged so it can sit a little tighter under the cards */
const pnbCards=a=>`<div class="pc-cards pnb-cards">${a.join('')}</div>`;
/* a line inside a fold: name left, Q1 to Q16 right, an optional reason under it (only where the model's own text gives one) */
const pnbLine=(name,a,b,why='')=>`<li><div class="pnb-fh"><span>${name}</span><b>${pnbP(a)} → ${pnbP(b)}</b></div>${why?`<small>${why}</small>`:''}</li>`;

/* ---------------------------------------------------------------- step 1: Revenue ---------------------------------------------------------------- */
/* the share a line wins by its age: six points on one line, each labelled */
function pnbRamp(ramp){
  const w=280,h=68,x0=16,x1=w-16,base=46,top=19,hi=Math.max(...ramp),X=i=>x0+(x1-x0)*i/(ramp.length-1),Y=v=>base-(base-top)*v/hi,ord=['1st','2nd','3rd','4th','5th','6th'];
  const d=ramp.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join('');
  let s=`<line x1="${x0-8}" x2="${x1+8}" y1="${base}" y2="${base}" stroke="${PC.line}"/>`
   +`<path d="${d}L${X(ramp.length-1).toFixed(1)} ${base}L${X(0).toFixed(1)} ${base}Z" fill="${PC.revBg}"/>`
   +`<path d="${d}" fill="none" stroke="${PC.rev}" stroke-width="2.6" stroke-linejoin="round"/>`;
  ramp.forEach((v,i)=>{const e=i===0||i===ramp.length-1;
    s+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${e?4.6:3.4}" fill="${e?PC.rev:'#fff'}" stroke="${PC.rev}" stroke-width="2"/>`
     +T(X(i),Y(v)-8,`${fd(v*100,0)}%`,'slab-b','middle',`font-size:${e?13.5:12.5}px;font-weight:${e?700:600};fill:${PC.rev}`)
     +T(X(i),base+16,ord[i]||String(i+1),'smut','middle','font-size:12px');});
  return `<svg class="pc-svg pnb-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="Share of a unit's market a line wins by its age, in quarters: ${ramp.map(v=>fd(v*100,0)+'%').join(', ')}">${s}</svg>`;
}
/* the product lines on the 16 quarters; each name sits above or below the line, whichever is clear of its neighbour */
function pnbLaunch(){
  const w=264,h=80,x0=8,x1=w-8,ax=38,X=q=>x0+(x1-x0)*q/15,nm={tile:'Tile',niche:'Niche',wood:'Wood',upvc:'uPVC',p5:'Waterproofing'},fs=13,placed={u:[],d:[]};
  let s=`<line x1="${x0}" x2="${x1}" y1="${ax}" y2="${ax}" stroke="${PC.line}" stroke-width="1.6"/>`;
  for(let q=0;q<16;q++)s+=`<line x1="${X(q).toFixed(1)}" x2="${X(q).toFixed(1)}" y1="${ax-3}" y2="${ax+3}" stroke="${PC.line}"/>`;
  const order=[...P].sort((a,b)=>MODEL.products[a].launch-MODEL.products[b].launch),lab=[];let alt='u';
  order.forEach(p=>{const q=MODEL.products[p].launch-1,t=q===0?(nm[p]||SH[p]):`${nm[p]||SH[p]} ${qName(q)}`,tw=pnbW(t,fs,600),x=X(q);
    const spans={middle:[x-tw/2,x+tw/2],start:[x-5,x-5+tw],end:[x+5-tw,x+5]},fit=a=>spans[a][0]>=1&&spans[a][1]<=w-1,free=(k,a)=>fit(a)&&placed[k].every(b=>spans[a][1]+6<=b[0]||spans[a][0]-6>=b[1]);
    const rows=[alt,alt==='u'?'d':'u'];let pick=null;
    for(const k of rows){for(const a of ['middle','start','end'])if(free(k,a)){pick=[k,a];break;}if(pick)break;}
    if(!pick)pick=[alt,fit('middle')?'middle':'start'];
    const [row,a]=pick;placed[row].push(spans[a]);alt=row==='u'?'d':'u';
    lab.push({p,q,t,x,a,row,tx:a==='middle'?x:a==='start'?x-5:x+5});});
  lab.forEach(o=>{s+=`<circle cx="${o.x.toFixed(1)}" cy="${ax}" r="5.2" fill="${PC.rev}" stroke="#fff" stroke-width="1.4"/>`+T(o.tx,o.row==='u'?ax-13:ax+27,o.t,'slab-b',o.a,`font-size:${fs}px;font-weight:600;fill:${PC.ink}`);});
  return `<svg class="pc-svg pnb-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="Launch quarters of the product lines: ${lab.map(o=>o.t).join(', ')}">${s}</svg>`;
}

CX.rev=D=>{
  const m=MODEL,Q=operatingModel().S,T15=D.T[15],w=Q[15],rt=view(SCOPE.core,'city'),dd=view(SCOPE.core,'dist'),uc=unitsBy('city',15),ud=unitsBy('dist',15),ramp=m.ramp.med,
    mk=m.market.medCity,sz=m.products.tile.size,sh=ramp[ramp.length-1],one=mk*sz*sh,n=P.length,late=Q[13].net,
    lines=P.map(p=>({p,v:sum(w.rows.filter(r=>r.p===p).map(r=>r.rev))})),mx=Math.max(...lines.map(l=>l.v)),mc=Math.max(rt.T[15],dd.T[15]),
    pc=v=>`${fd(v/T15*100,0)}%`,waits=['wood','upvc','p5'].map(p=>m.products[p].wait);
  const m0=INP.valuation.todayMRR,g=Math.pow(D.T[7]/m0,1/23)-1;   /* monthly growth from today's MRR to the Q8 quarter-end month: 23 months */
  const c0=PK.card({col:PC.rev,title:`${fd(T15/m0,0)}× in ${pnbWords[16/4]} years`,hero:[`₹${fd(m0,1)} → ₹${fd(T15,1)} Cr`,'a month'],
    note:`About <b>${fd(g*100,0)}% a month</b> for the first two years`});
  const op=c=>`<i class="pk-op">${c}</i>`;
  const c1=PK.card({col:PC.rev,title:'How one unit’s revenue is built',
    body:PK.led([{l:op('')+'Units open',v:'1'},{l:op('×')+'Market size',v:`₹${pnbN(mk)} Cr`},{l:op('×')+'Product size',v:`${pnbN(sz)}×`},{l:op('×')+'Share at age',v:`${fd(sh*100,0)}%`},{l:op('=')+'Revenue a month',v:`₹${fd(one,2)} Cr`,tot:1}]),
    note:`${uc+ud} units, ${n} lines: <b>${rc(T15)}</b> at Q16`});
  /* the lines in launch order, as chips: HTML, so the type stays one size on every screen */
  const order=[...P].sort((a,b)=>m.products[a].launch-m.products[b].launch),lname={tile:'Tile',niche:'Niche',wood:'Wood',upvc:'uPVC',p5:'Waterproofing'};
  const chips=`<div class="pnb-lc">${order.map(p=>{const q=m.products[p].launch-1;return `<span><i></i>${lname[p]||SH[p]}<em>${q>0?qName(q):'now'}</em></span>`;}).join('')}</div>`;
  const c3=PK.card({col:PC.rev,title:`${pnbCap(pnbWords[n]||String(n))} lines, launched in turn`,body:PK.vis(chips)});
  const rows=a=>a.map(([l,v,mxv])=>`<div class="pnb-hb"><span>${l}</span><i style="width:${Math.max(v/mxv,.02)*100}%;background:${PC.rev}"></i><b>${pc(v)}</b></div>`).join('');
  const fold=pnbF(whyD('Share by age, mix, what-ifs',
    `<p class="pnb-fk">Share builds with age</p>${pnbRamp(ramp)}<p class="pnb-fn">Contractors try, repeat, then switch.</p>`
    +`<p class="pnb-fk" style="margin-top:12px">Share of Q16 revenue</p>${rows(lines.map(l=>[SH[l.p],l.v,mx]))}<div class="pnb-sep"></div>${rows([['Cities',rt.T[15],mc],['Dealer zones',dd.T[15],mc]])}`
    +`<p class="pnb-fn">${uc} cities and ${ud} dealer zones are open by Q16. A new line waits ${Math.min(...waits)}–${Math.max(...waits)} quarters in a city before it sells. GST is ignored.</p>`
    +cxLev('Q16 revenue a month if…',[['Revenue runs two quarters late',rc(late),dlt(late,w.net)],['70% of the plan is achieved',rc(w.net*.7),dlt(w.net*.7,w.net)]],`${capLink('basis','Model basis · 01')}${capLink('cities','Cities and DD zones · 04')}${capLink('products','Products · 05')}`)));
  return {lead:'',body:pnbCards([c0,c1,c3])+fold};
};

/* ---------------------------------------------------------------- step 2: Margins ---------------------------------------------------------------- */
/* the founders' names for the cost lines; the base arrays OP_LINES / OP_COSTS carry the same names, so every page matches */
const pnbNames={influencer:'Influencer payouts / distributor schemes',brand:'Brand payout',rm:'RM costs (salary, TA/DA, bonus)',lastMile:'Last-mile logistics overheads',discount:'Discounts',npa:'NPAs / returns',
  software:'3rd-party software, subscriptions & reports',salary:'Employees’ salaries & tours',cac:'Customer acquisition cost (CAC)',office:'Office & administrative expenses',godown:'Godown rent & expenses',marketing:'Marketing / promotion expenses',legal:'Finance & legal fees'};
OP_LINES.forEach(r=>{if(pnbNames[r[0]])r[1]=pnbNames[r[0]];});OP_COSTS.forEach(r=>{if(pnbNames[r[0]])r[1]=pnbNames[r[0]];});
/* the reasons the model's own text gives for a line; a line with none here has none in the file and is left without one */
const pnbWhy={
  influencer:'Rewards paid to contractors and distributors, which bring dealer and distributor orders.',
  brand:'A partner brand on entry-level adhesive lets distributors in new zones say yes on day one.',
  rm:'AI-enabled workflow and multi-category focus.',
  lastMile:'Falls as stores fill up and each delivery carries more value.'};

CX.mar=D=>{
  const Q=operatingModel().S,f=Q[0],l=Q[15];
  /* one step of the waterfall: lo and hi are % of revenue; subtotals are outlined, costs hang from the level above */
  const row=(name,lo,hi,col,val,kind='')=>`<div class="pnb-wf ${kind}"><span>${name}</span><span class="t"><i style="left:${Math.max(lo,0)}%;width:${Math.max(hi-lo,.8)}%;${col?`background:${col}`:`box-shadow:inset 0 0 0 1.5px ${PC.mute}`}"></i></span><b${kind.includes('tot')?` style="color:${col}"`:''}>${val}</b></div>`;
  const cm1=l.cm1P,cm2=l.cm2P,pat=l.patP;
  /* revenue less the three cost groups gives operating profit; CM1 and CM2 are in the table under the chart */
  const wf=row('Revenue',0,100,PC.rev,'100%')
   +row('Cost of goods',cm1,100,PC.cogs,'−'+pctR(l.cogsP))
   +row('Selling costs',cm2,cm1,PC.sell,'−'+pctR(l.varP))
   +row('Fixed costs',Math.max(pat,0),cm2,PC.oh,'−'+pctR(l.fixP))+row('Operating profit',0,Math.abs(pat),pat<0?PC.loss:PC.profit,pctR(pat),pat<0?'tot loss':'tot');
  /* card A: the three levers, each as its share of revenue at Q1 and Q16 with the reason */
  const sh=(w,k)=>w.amount[k]/w.net*100,fx=(w,ks)=>sum(ks.map(k=>w.overhead.by[k]))/w.net*100,A=(a,b)=>`${pnbPc(a)} → ${pnbPc(b)}`;
  const rel=(l.cogsP/f.cogsP-1)*100;
  /* the headline: the monthly growth over the first two years (as on step 1), and whether the operating margin never falls */
  const g=Math.pow(D.T[7]/INP.valuation.todayMRR,1/23)-1,up=Q.every((w,i)=>!i||w.patP>=Q[i-1].patP-0.05);
  const c1=PK.card({col:PC.profit,title:up?'Margins improve every quarter':'Margins improve as we grow',sub:`as revenue grows about ${fd(g*100,0)}% a month`,
    body:PK.rows([
      {sw:PC.cogs,name:'Cost of goods',fig:A(f.cogsP,l.cogsP),why:`${fd(-rel,0)}% lower: buying at scale, own-label formulations, plant utilisation`},
      {sw:PC.sell,name:'RM costs',fig:A(sh(f,'rm'),sh(l,'rm')),why:pnbWhy.rm.replace(/\.$/,'')},
      {sw:PC.oh,name:'Fixed costs',fig:A(f.fixP,l.fixP),why:`Salaries ${pnbP(fx(f,['salary']))} → ${pnbP(fx(l,['salary']))} · marketing + CAC ${pnbP(fx(f,['marketing','cac']))} → ${pnbP(fx(l,['marketing','cac']))}`}])});
  const c2=PK.card({col:PC.profit,title:'From revenue to profit · Q16',body:PK.vis(`<div class="pnb-wfs">${wf}</div>`)});
  const disc=Q.some(w=>Math.abs(w.amount.discount)>1e-9),sellKs=OP_LINES.filter(([k])=>k!=='discount'||disc);
  const sellL=sellKs.map(([k,lb])=>pnbLine(lb,sh(f,k),sh(l,k),pnbWhy[k]||'')).join('');
  const ohL=OP_COSTS.map(([k,lb])=>pnbLine(lb,f.overhead.by[k]/f.net*100,l.overhead.by[k]/l.net*100)).join('');
  const fold=pnbF(whyD('Every cost line',
    `<p class="pnb-fk">${swc(PC.cogs)}Cost of goods · ${pctR(f.cogsP)} → ${pctR(l.cogsP)}</p><p class="pnb-fn">Materials and inbound freight. Volume buying and own-label formulations lower it, and the mix of sales moves it.</p>`
    +`<p class="pnb-fk">${swc(PC.sell)}Selling costs · ${pctR(f.varP)} → ${pctR(l.varP)}</p><ul class="pnb-fl">${sellL}</ul>`
    +`<p class="pnb-fk">${swc(PC.oh)}Fixed costs · ${pctR(f.fixP)} → ${pctR(l.fixP)}</p><ul class="pnb-fl">${ohL}</ul><p class="pnb-fn">Fixed costs are a budget set by revenue level, so they grow far slower than revenue: salaries, office, software and store rent are absorbed over a bigger base. Operating profit is before tax, interest and depreciation.</p>`
    +cxLev('Q16 operating profit a month if…',[['Cost of goods is 1 point higher',sr(l.pat-l.net*.01),dlt(l.pat-l.net*.01,l.pat)],['Fixed costs are 20% higher',sr(l.pat-l.fixed*.2),dlt(l.pat-l.fixed*.2,l.pat)]])
    +`<p class="pnb-fn">Cost rates move in a straight line from Q1 to Q16, weighted by revenue. GST is ignored. ${capLink('audit','All 16 monthly snapshots · 06')}</p>`));
  return {lead:'',body:pnbCards([c1,c2])+fold};
};

/* ---------------------------------------------------------------- step 5: Investor return ---------------------------------------------------------------- */
CX.ret=D=>{
  const R=D.R,X=D.X,ret=D.ret,ld=ret.lead,pr=ret.pr,q=X.q,e=pr[0],Fd=INP.funding,L=ld.amt,cur=X.m==='pat'?'pat':`arr-${X.mult}`;
  const n0=v=>`₹${fd(v,0)} Cr`,lb=k=>k==='pat'?`${f0(Fd.multPat)}× operating profit`:`${f0(+String(k).split('-')[1]||X.mult)}× ARR`,lbs=k=>k==='pat'?`${f0(Fd.multPat)}× profit`:lb(k);
  /* the one control: how the Q16 exit is valued (the labels come from the inputs; short on the buttons so the row stays one line) */
  const pre=`<div class="pnb-ctl"><div class="pnb-cr"><span>Exit valued at</span>${seg(RET_M.map(([k])=>[k,lbs(k)]),cur,'exitm','Exit valued at')}</div></div>`;
  const c1=PK.card({col:PC.value,title:`${n0(L)} in this round`,hero:[pcXh(ld.mult),`at a ${qName(q)} exit`],note:`${n0(ld.val)} · ${pctR(ld.irr*100)} a year · valued at ${lb(cur)}`});
  /* card 2: the value of the cheque at each round's post-money price, then at the exit */
  const rows=[...ld.marks.map(m=>({l:`Round ${m.n} · ${qName(m.q)}`,v:m.val,x:m.mult})),{l:`Exit · ${qName(q)}`,v:ld.val,x:ld.mult,end:1}],mx=Math.max(...rows.map(r=>r.v),1e-9);
  const c2=PK.card({col:PC.value,title:'Marked up at every round',body:PK.vis(`<div class="pnr-rows">${rows.map(r=>`<div class="pnr-r${r.end?' end':''}"><span>${r.l}</span><i><u style="width:${(Math.max(r.v/mx,.03)*100).toFixed(1)}%"></u></i><b>${n0(r.v)}</b><em>${pcX(r.x)}</em></div>`).join('')}</div>`)});
  /* card 3: Tejas's equity value at the exit: EV (ARR or profit times the multiple) plus cash */
  const arr=12*D.T[q],pat4=12*R.G.patMonthly[q],basis=X.m==='pat'?`Operating profit ${n0(pat4)} × ${f0(Fd.multPat)}`:`ARR ${n0(arr)} × ${f0(X.mult)}`,led=[{l:basis,v:n0(ret.ev)},{l:'Cash on hand',v:n0(ret.cash)}];
  if(ret.debt>1e-9)led.push({l:'Debt',v:'−'+n0(ret.debt)});
  led.push({l:'Equity value',v:n0(ret.eqv),tot:1});
  const c3=PK.card({col:PC.value,title:'Tejas at exit',body:PK.led(led),note:'Acquired revenue not included: upside.'});
  const others=RET_M.filter(([k])=>k!==cur).map(([k])=>{const [m,x]=k.split('-'),r=investorReturn(R,{q,m,mult:x?+x:undefined,ach:1}).lead;return [`At ${lb(k)}`,n0(r.val),`${pcXh(r.mult)} · IRR ${pctR(r.irr*100)}`];});
  const fold=pnbF(whyD('How the value is worked out',
    `<p class="pnb-fn">The ${n0(L)} goes in at round 1’s price: ${n0(e.post)} post-money, ${f0(INP.valuation.multiple)}× today’s ARR of ${n0(e.arr)}. Rounds 2 to ${pr.at(-1).n} are priced at ${f0(R.P.roundMult)}× the ARR of their quarter, and all ${pr.length} rounds are counted. Each round row in the panel is the ${n0(L)} at that round’s post-money price.</p>`
    +`<p class="pnb-fn">The exit is fixed at ${qName(q)} (${QD[q].a}–${QD[q].z} ${QD[q].yz}, the last quarter): ${n0(ld.val)} is ${pcXh(ld.mult)} the money, ${pctR(ld.irr*100)} a year. Each bar in the chart is the same ${n0(L)} valued as if Tejas exited in that quarter.</p>`
    +cxLev(`The same ${qName(q)} exit, valued the other way`,others)
    +`<p class="pnb-fn">Acquisitions are counted at cost: ${R.acq.usd>0?`$${fd(R.acq.usd,0)}M (${n0(R.acq.amt)}) `:''}is held as cash at face value, and the revenue it may bring is upside, left out.</p>`));
  return {lead:'',pre,body:pnbCards([c1,c2,c3])+fold};
};
}

/* Page 03, right-hand panels for steps 3, 4 and 6 (CX.spend, CX.raise, CX.roce).
   Two or three PK.card cards each (panel-kit.js), one fold per panel.
   The panels are static: they never read a selected quarter. Every figure comes from the model (capData, roceFin, stressCases).
   Everything sits inside one function so its names cannot clash with the other panel files. */
(function(){
const NB=' ',add=a=>a.reduce((s,v)=>s+v,0);
/* ₹ figures: one decimal only when there is one (140, 248.6) */
const F=v=>{const r=Math.round(v*10)/10;return (r<0?'−':'')+fd(Math.abs(r),Number.isInteger(r)?0:1);};
const Rs=v=>`₹${F(v)}${NB}Cr`,R0=v=>`₹${fd(v,0)}${NB}Cr`;
const pc0=v=>(v<-0.5?'−':'')+fd(Math.abs(v),0)+'%',pc1=v=>(v<0?'−':'')+fd(Math.abs(v),1)+'%';
const sw=c=>`<i class="pnc-sw" style="background:${c}"></i>`;
/* the cards, then the panel's one fold (the fold follows .pnc-cards, which is how the larger fold type is reached) */
const panel=(cards,fold,mod)=>`<div class="pc-cards pnc-cards${mod?' '+mod:''}" style="flex:${cards.length} 1 auto">${cards.join('')}</div>${fold}`;
/* a stacked bar. A segment may carry a full label (t) and a short one (s); the stylesheet shows the longest that fits the segment.
   The bucket number is the label's width in 8 px steps, matching the container queries in panels-c.css. */
const tw=t=>[...String(t)].reduce((w,c)=>w+(c>='0'&&c<='9'?7.2:c===' '?3.3:c==='·'?4:6.4),0);
const bk=(t,short)=>Math.min(32,Math.max(1,Math.ceil((tw(t)+(short?1:8))/8)));
const bar=(parts)=>`<div class="pnc-bar" role="img" aria-label="${parts.filter(p=>p.v>1e-9&&p.n).map(p=>p.n).join(', ')}">${parts.filter(p=>p.v>1e-9).map(p=>`<i style="flex:${p.v} 1 0;background:${p.c};color:${p.tc||'#fff'}${p.o?`;box-shadow:inset 0 0 0 1px ${p.o}`:''}" title="${p.n||''}">${p.t?`<span class="pnc-f pnc-f${bk(p.t)}">${p.t}</span>`:''}${p.s?`<span class="pnc-s pnc-s${bk(p.s,1)}">${p.s}</span>`:''}</i>`).join('')}</div>`;
/* the three growth-spending parts, as figures under a bar; each column's top rule carries its segment colour */
const partsRow=parts=>`<div class="pnc-parts">${parts.map(p=>`<div class="pnc-part" style="--pc:${p.c}"><b>₹${F(p.v)}</b><span>${p.l}</span></div>`).join('')}</div>`;

/* ---------------- step 3: growth spending and the funding need ---------------- */
CX.spend=D=>{
  const G=D.G,K=G.K,S=cxSeries(D),L=G.N-1,c=K.cum[L],lead=K.leadQ,days=K.days(),C=INP.capital;
  /* card 1: what a rupee of capital carries, at the last quarter */
  const arr=12*D.T[L],ce=roceFin(G)[L].ce,turns=ce>0?arr/ce:0;
  const t1=v=>fd(Math.round(v*10)/10,Number.isInteger(Math.round(v*10)/10)?0:1);
  const cmp=(lab,v,col)=>`<div class="pnc-cm"><span>${lab}</span><div class="pnc-cm-t"><i style="width:${(100*v/Math.max(arr,ce,1e-9)).toFixed(1)}%;background:${col}"></i></div><b>${R0(v)}</b></div>`;
  const c1=PK.card({title:'A capital-absorption machine',hero:[`₹${t1(turns)}`,'of yearly revenue for every ₹1 of capital'],body:PK.vis(`<div class="pnc-cmp">${cmp('ARR',arr,PC.rev)}${cmp('Capital',ce,PC.capex)}</div>`),col:PC.capex});
  /* card 2: three triggers pace the whole growth spending to the last quarter (capex + working capital) */
  const St=K.steps,item=k=>add(St[k].costs),plants=item('tileP5')+item('wood')+item('upvc');
  const nLab=St.labs.costs.length,nCen=St.centres.costs.length,nSys=St.systems.costs.length,nMis=St.misc.costs.length;
  const perPlant=plants/nLab,perCity=(K.units[L]-4)/nCen,dRev=D.T[L]-K.m0;
  const ahead=lead>1?`${lead} quarters ahead`:lead===1?'a quarter ahead':'as sales need it';
  const before=lead>1?`${lead} quarters before`:lead===1?'a quarter before':'when';
  const seg=(v,col,n)=>({v,c:col,n:`${n} · ${Rs(v)}`});
  const trig=[
    {sh:'▲',h:'Sales outgrow capacity',rule:`Plant phases bought ${ahead} of sales; a lab per ${Rs(perPlant)} of plant`,
      seg:[seg(plants,PC.capex,'Plants'),seg(item('labs'),PC.labs,'Labs')]},
    {sh:'●',h:'New cities open',rule:`A centre per ~${fd(perCity,0)} new cities or zones`,
      seg:[seg(item('centres'),PC.capex,'Experience centres')]},
    {sh:'■',h:'Revenue grows',rule:`Working capital at ${fd(days,0)} days; systems and misc in steps`,
      seg:[seg(item('misc'),PC.capex,'Misc'),seg(item('systems'),PC.labs,'Systems'),seg(c.wc,PC.wc,'Working capital')]}];
  trig.forEach(t=>t.v=add(t.seg.map(x=>x.v)));
  const tot=add(trig.map(t=>t.v)),tmax=Math.max(...trig.map(t=>t.v),1e-9);
  const trow=t=>`<div class="pnc-tg"><div class="pnc-tg-h"><span><i>${t.sh}</i>${t.h}</span><b>${Rs(t.v)}</b></div><p>${t.rule}</p>`
    +`<div class="pnc-tr"><div class="pnc-tb" role="img" aria-label="${t.seg.map(x=>x.n).join(', ')}" style="width:${(100*t.v/tmax).toFixed(1)}%">${t.seg.map(x=>`<i style="flex:${x.v} 1 0;background:${x.c}" title="${x.n}"></i>`).join('')}</div></div></div>`;
  const c2=PK.card({title:`Three triggers pace the ${Rs(tot)}`,body:PK.vis(trig.map(trow).join('')),col:PC.capex});
  const rule={tileP5:`paid ${before} sales pass built capacity`,wood:`paid ${before} sales pass built capacity`,upvc:`paid ${before} sales pass built capacity`,
    centres:`one per ~${fd(perCity,0)} new cities or dealer zones`,labs:`one per ${Rs(perPlant)} of plant, same quarter`,
    systems:`one per ~${Rs(dRev/nSys)} of added monthly revenue`,misc:`one per ~${Rs(dRev/nMis)} of added monthly revenue`};
  /* the fold: the per-item rules and phase plan, and what moves the peak */
  const plan=CAPEX_ITEMS.map(([k,l,bk])=>{const s=St[k];return `<div class="pnc-ph"><div class="pnc-ph-h"><span>${sw(stepCol(bk))}${l}</span><b>${Rs(add(s.costs))}</b></div><small>${stepCostText(s.costs)}, ${rule[k]} · ${stepWhen(s.buys)}</small></div>`;}).join('')
    +`<div class="pnc-ph"><div class="pnc-ph-h"><span>${sw(PC.wc)}Working capital</span><b>${Rs(c.wc)}</b></div><small>${fd(days,0)} days of the revenue added, topped up every quarter</small></div>`;
  const pk=o=>{const r=raisePlan(o);return Math.max(...r.G.gap.map((v,i)=>v+r.D.cumInt[i]));},a=pk({capital:{wcDays:45}}),b=pk({capital:{wcDays:90}}),p=pk({plantMult:1.2}),l=pk({lateQ:2});
  const more=whyD('Timing, phases, what-ifs',
    `<p class="cx-sub">Phase plan to ${qName(L)}</p>${plan}`
    +`<p class="cx-note">Each phase is paid ${lead} quarter${lead===1?'':'s'} before demand passes the capacity built. Centres open with new cities and dealer zones (${C.centresN} × ${rc(K.X.centres/C.centresN)}). Dark stores and distribution points carry no capex of their own: set-up sits in misc, rent in overhead.${fn(NOTE_PLANT)}</p>`
    +cxLev('Peak cash required if…',[['Working-capital target is 45 days',rc(a),dlt(a,S.peak)],['Working-capital target is 90 days',rc(b),dlt(b,S.peak)],['Plants cost 20% more',rc(p),dlt(p,S.peak)],['Revenue is two quarters late',rc(l),dlt(l,S.peak)]]));
  return {lead:'',body:panel([c1,c2],more,'pnc-c2')};
};

/* ---------------- step 4: the funding flywheel ---------------- */
/* a round's size as the founders state it: US$ M for the acquisition rounds, ₹ Cr for the others; a quarter with its months ("Q4, Jul–Sep 2027") */
const amtS=r=>r.usd!=null?`$${fd(r.usd,0)}M`:Rs(r.amt);
const qWhen=q=>{const d=QD[q];return `${qName(q)}, ${d.ya===d.yz?`${d.a}–${d.z} ${d.ya}`:`${d.a} ${d.ya}–${d.z} ${d.yz}`}`;};
/* one step of the cycle: a numbered dot, a thin line down to the next dot */
const fstep=(n,html)=>`<li><i class="pnc-fd">${n}</i><span>${html}</span></li>`;
CX.raise=D=>{
  const R=D.R,P=R.P,pr=D.pr,S=cxSeries(D),col=PC.fund,r1=pr[0],org=pr.filter(r=>r.kind!=='acq'),acq=pr.filter(r=>r.kind==='acq'),r2=pr.find((r,i)=>i>0&&r.kind!=='acq');
  const rng=a=>a.length<2?`${a.length?a[0].n:''}`:`${a[0].n}–${a.at(-1).n}`,orgAmt=R.organic.equity,usd=R.acq.usd;
  /* card 1: the first turn of the cycle, all computed: money in, ARR up, valuation up, the next round */
  let c1;
  if(r2){const up=r2.pre/r1.post,g=r2.arr/r1.arr;
    c1=PK.card({title:'Each round buys the next',body:PK.vis(`<ol class="pnc-fl">${fstep(1,`Raise <b>${Rs(r1.amt)}</b> now`)}${fstep(2,`ARR <b>₹${fd(r1.arr,0)} → ₹${fd(r2.arr,0)}${NB}Cr</b> by ${qName(r2.q)} (${pcX(g)})`)}${fstep(3,`Valuation <b>${pcX(up)}</b> the round-1 price`)}${fstep(4,`Raise <b>${Rs(r2.amt)}</b> in round ${r2.n}`)}</ol>`),col});
  }else c1=PK.card({title:'Each round buys the next',note:`Round 1 (${Rs(r1.amt)}) funds the plan; there is no organic round 2.`,col});
  /* card 2: the ladder, grouped organic then acquisitions */
  const lrow=r=>`<div class="pnc-lr"><span>R${r.n} · ${qName(r.q)}</span><b>${amtS(r)}</b><span>${R0(r.pre)}</span><b class="pnc-su">${r.stepUp?pcX(r.stepUp):'–'}</b></div>`;
  const lgrp=(name,tot,a)=>a.length?`<div class="pnc-lg">${name} · ${tot}</div>${a.map(lrow).join('')}`:'';
  const c2=PK.card({title:'Four rounds, rising prices',body:PK.vis(`<div class="pnc-ld"><div class="pnc-lh"><span>Round</span><span>Raise</span><span>Pre-money</span><span>Step-up</span></div>`
    +lgrp('Organic',Rs(orgAmt),org)+lgrp('Acquisitions',`$${fd(usd,0)}M`,acq)+`</div>`),col});
  /* card 3: what rounds 3 and 4 are for */
  const c3=acq.length?PK.card({title:`Rounds ${rng(acq)}: buy and plug in`,hero:[`$${fd(usd,0)}M`,'for acquisitions'],note:'Regional brands and plants.',col}):'';
  /* the fold: how the rounds are priced and the cash they leave */
  const peak=S.peak,low=R.organic.minCash,lowQ=R.organic.minQ,before=r2&&lowQ<r2.q,enough=orgAmt>=peak-1e-9;
  const more=whyD('Pricing and cash',
    `<p class="cx-note">Round 1 is priced at ${fd(INP.valuation.multiple,0)}× today’s ARR (${R0(r1.post)} post-money). Each later round is priced at ${fd(P.roundMult,0)}× the ARR of its quarter (12 × the quarter’s last month). Dollar rounds convert at ₹${fd(R.fx,0)} per $.${fn(NOTE_PRICE)}</p>`
    +cxLev(`Rounds ${rng(org)} and the organic plan`,[['Cash required, at its peak',Rs(peak),qName(S.pk)],[`Raised in rounds ${rng(org)}`,Rs(orgAmt),enough?`${Rs(orgAmt-peak)} above`:`${Rs(peak-orgAmt)} short`],['Lowest cash',Rs(low),`${qName(lowQ)}${before?`, before round ${r2.n} lands`:''}`]])
    +`<p class="cx-note">Lowest cash is ${low>=P.buffer-1e-9?'above':'under'} the ${Rs(P.buffer)} floor.${acq.length?` Rounds ${rng(acq)} (${Rs(R.acq.amt)}) sit in the model as cash and count at face value at the exit; the acquisitions and their revenue are not modelled.`:''} ${R.D.on?`Debt is on: ${rc(R.D.bal[R.N-1])} outstanding at ${qName(R.N-1)}.`:'Debt is off.'}${fn(NOTE_FUND)}</p>`);
  return {lead:'',body:panel([c1,c2,c3].filter(Boolean),more,'pnc-c4')};
};
/* ---------------- step 6: return on capital ---------------- */
CX.roce=D=>{
  const G=D.G,K=G.K,ro=roceFin(G),L=G.N-1,l=ro[L],Fd=INP.funding,c=K.cum[L],m=G.patMonthly[L],wcT=K.wcTotal[L];
  const cell=(op,fig,lab,col)=>`<div class="pnc-mx-c"><i>${op}</i><div><b style="color:${col}">${fig}</b><span>${lab}</span></div></div>`;
  const cr=v=>`₹${F(v)}<small>${NB}Cr</small>`;
  /* card 1: the headline figure, and the equation behind it */
  const c1=PK.card({title:'A ROCE machine',hero:[pc0(l.pre*100),`return on capital by ${qName(L)}`],note:`${pc0(l.post*100)} after depreciation.`,col:PC.profit});
  /* card 2: the return before depreciation, every quarter, and when it passes three marks */
  const v=ro.map(x=>x.pre*100),lo2=-20,hi=Math.max(...v,1),rg=hi-lo2;
  const zero=100*hi/rg;
  const bars=v.map((x,q)=>{const h=100*Math.abs(Math.max(x,lo2))/rg;return `<i class="${x<0?'neg':''}" title="${qName(q)} · ${pc0(x)}" style="${x<0?`top:${zero.toFixed(1)}%`:`bottom:${(100-zero).toFixed(1)}%`};height:${h.toFixed(1)}%;left:${(100*q/16+.7).toFixed(2)}%;background:${x<0?PC.loss:PC.profit}"></i>`;}).join('');
  const first=t=>v.findIndex(x=>x>=t),f0=first(1e-9);
  const ms=[[f0,'Positive in'],[first(20),'20%+ by'],[first(40),'40%+ by']].filter(m=>m[0]>=0).map(m=>`${m[1]} ${qName(m[0])}`);
  const c2=PK.card({title:f0<0?'Fast: the return climbs':f0<=3?'Fast: positive within a year':`Fast: positive in ${qName(f0)}`,body:PK.vis(`<div class="pnc-mc" role="img" aria-label="Return on capital before depreciation, by quarter"><div class="pnc-mc-p">${bars}<u style="top:${zero.toFixed(1)}%"></u></div><div class="pnc-mc-x"><span>${qName(0)}</span><span>${qName(L)}</span></div></div>`),note:ms.join(' · '),col:PC.profit});
  /* card 3: margin x capital turns = return */
  const arr=12*D.T[L],mg=arr>0?12*m/arr:0,turns=l.ce>0?arr/l.ce:0,t1=Math.round(turns*10)/10,tt=fd(t1,Number.isInteger(t1)?0:1);
  const c3=PK.card({title:'Efficient: margin × capital turns',body:PK.vis(`<div class="pnc-mx">${cell('',pc0(mg*100),'operating margin',PC.profit)}${cell('×',tt,'capital turns',PC.capex)}${cell('=',pc0(l.pre*100),'return',PC.profit)}</div>`),
    note:`Each ₹1 of capital turns over ₹${tt} of sales a year.`,col:PC.profit});
  /* the fold: what capital is included, the depreciation-adjusted figure, what moves it, and what it leaves out */
  const parts=[{l:'Capex',v:c.capex,c:PC.capex},{l:'Labs / systems',v:c.pp,c:PC.labs,tc:PC.ink},{l:'Working capital',v:wcT,c:PC.wc,tc:PC.ink}];
  const rq=o=>roceFin(gapFin(o))[L].pre*100,v45=rq({capital:{wcDays:45}}),v90=rq({capital:{wcDays:90}}),vp=rq({plantMult:1.2}),pts=x=>fd(x,1)+' pts';
  const more=whyD('Capital and what-ifs',
    `<p class="cx-sub">How the return is measured</p><div class="pnc-mx" style="margin:0 0 10px">${cell('',cr(12*m),'profit a year',PC.profit)}${cell('÷',cr(l.ce),'capital',PC.capex)}${cell('=',pc0(l.pre*100),'return',PC.profit)}</div><p class="cx-sub">Capital included · ₹ Cr at ${qName(L)}</p>`+bar(parts.map(p=>({v:p.v,c:p.c,n:`${p.l} · ${Rs(p.v)}`})))+partsRow(parts)
    +cxLev(`${qName(L)} return, before and after depreciation`,[['Before depreciation',pc1(l.pre*100),''],[`Depreciation a year<small>straight line: plants and centres over ${fd(Fd.lifePlant,0)} years; labs, systems and misc over ${fd(Fd.lifeOther,0)}</small>`,rc(4*l.dep),''],['After depreciation',pc1(l.post*100),'']])
    +cxLev(`${qName(L)} return before depreciation if…`,[['Working-capital target is 45 days',pc1(v45),dlt(v45,l.pre*100,pts)],['Working-capital target is 90 days',pc1(v90),dlt(v90,l.pre*100,pts)],['Plants cost 20% more',pc1(vp),dlt(vp,l.pre*100,pts)]])
    +`<p class="cx-note">Forecast assets and the full working-capital target. Existing fixed assets are excluded. This is not complete company ROCE. Working capital is the full ${fd(K.days(),0)}-day target, including its ${rc(K.openingWC)} opening balance.${fn(NOTE_RET)}</p>`);
  return {lead:'',body:panel([c1,c2,c3],more,'pnc-c6')};
};
})();
