/* ================= Tejas design system =================
   COLOUR · three rules
     1 Hue = what something is (product line, city vs dealer zone, kind of cash use)
     2 Neutral shade = how much or how deep (units opened, CM1 → CM2 → PAT)
     3 Clay orange = the highlight: the question, the answer and the figures that carry it.
   PALETTE · Anthropic neutrals (ivory #FAF9F5, slate #141413, greys #E8E6DC / #B0AEA5) with its orange, blue and green, plus fig, sand and sage for the remaining kinds.
   TYPE FAMILIES · Poppins for headings and key figures, Lora for prose, IBM Plex Sans for data (tabular figures).
   Controls and links are ink, never a data colour.
   TYPE · 11.5 meta · 12.5 label · 13.5 body · 16 panel title · 18 question · 20 section · 24 metric · 30 answer
   Weights 400 / 500 / 600. Nothing on screen under 11px. */
:root{
  --paper:#FAF9F5;--surface:#FFFFFF;--sunk:#F0EEE6;--rule:#E8E6DC;--rule-2:#D6D3C8;
  --ink:#141413;--ink-2:#3D3C38;--ink-3:#6B6963;
  --accent:#B4532F;--accent-fill:#D97757;--accent-soft:#FBECE5;
  --tile:#2F5F94;--wood:#6A9BCC;--niche:#B4CFEA;--upvc:#5F7F3A;--p5:#A3567F;
  --city:#B08A47;--city-l:#EAD7AE;--deal:#5E8577;--deal-l:#C2D6CC;
  --n1:#E8E6DC;--n2:#D6D3C8;--n3:#9C998F;--n4:#3D3C38;
  --capex:#8C5A34;--intang:#C08A5B;--wc:#E6CFAE;--burn:#9C998F;--misc:#E8E6DC;
  --r:8px;--f:'Plex',system-ui,-apple-system,'Segoe UI',sans-serif;--fd:'Poppins','Plex',system-ui,sans-serif;--ft:'Lora','Plex',Georgia,serif;
  /* original dashboard variables, re-pointed to the system */
  --white:#fff;--slate:#55544F;--blue:#3D3C38;--navy:#141413;--secondary:#55544F;--text:#141413;--border:#E8E6DC;
  --rule-soft:#EEECE4;--wash:#F0EEE6;--selected:#EEECE4;--focus:#141413;--axis:#A3A199;--data-1:#141413;--radius:8px;
}
html{background:var(--paper)}
body{font-family:var(--f)!important;font-size:13.5px;line-height:1.5;color:var(--ink);background:var(--paper);font-feature-settings:"tnum" 1}
button,input,select{font-family:var(--f)}
a{color:var(--ink-2);text-decoration:underline;text-decoration-color:var(--rule-2);text-underline-offset:3px}
a:hover{color:var(--ink);text-decoration-color:var(--ink)}
.shell{max-width:1880px;padding:0 32px}
@media(max-width:1600px){.shell{padding:0 24px}}
/* ---------- top bar ---------- */
.topbar{background:var(--surface);border-bottom:1px solid var(--rule)}
.topbar-inner{min-height:56px}
.brand strong{font-family:var(--f);font-weight:600;font-size:20px;letter-spacing:-.01em;color:var(--ink)}
.brand span{font-size:11.5px;color:var(--ink-3)}
.nav{gap:4px}
.nav a{font-size:13px;color:var(--ink-3);text-decoration:none;padding:0 10px;border-bottom:2px solid transparent;font-weight:500}
.nav a:hover{color:var(--ink)}
.nav a[aria-current=page]{color:var(--ink);font-weight:600;border-bottom:2px solid var(--ink)}
.nav a.nav-quiet{border-left:1px solid var(--rule);margin-left:8px;padding-left:16px}
.horizon{font-size:11.5px;color:var(--ink-3)}
/* ---------- product filter bar ---------- */
.global-controls{padding:10px 0;border-bottom:1px solid var(--rule);gap:18px}
.global-controls[hidden]{display:none!important}
.product-pick{font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;gap:2px}
.outside-plan{color:var(--ink-3);font-size:12px}.outside-plan em{font-style:normal;font-size:11.5px;margin-left:4px}
.scope-label{font-size:12px;color:var(--ink-3)}
/* ---------- controls: ink, not data colours ---------- */
.segmented{border:1px solid var(--rule-2);border-radius:6px;overflow:hidden;background:var(--surface)}
.segmented button{font-size:12.5px;font-weight:500;color:var(--ink-2);background:transparent;border:0;padding:6px 12px}
.segmented button[aria-pressed=true]{background:var(--ink);color:#fff}
.toggle{font-size:12.5px;color:var(--ink-2)}
.toggle[aria-checked=true] .toggle-track{background:var(--ink)!important}
.toggle .toggle-track{background:var(--n2)}
select,input[type=search]{border:1px solid var(--rule-2);border-radius:6px;font-size:12.5px;color:var(--ink);background:#fff}
.s-edit,.footnotes button,.source-tools button{font-size:12.5px;font-weight:500;color:var(--ink);background:#fff;border:1px solid var(--rule-2);border-radius:6px;padding:7px 12px;text-decoration:none}
.s-edit:hover{border-color:var(--ink)}
/* ---------- page header: crumb, question, answer ---------- */
.page{padding-top:20px}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin:2px 0 18px}
.ph-main{border-left:3px solid var(--accent);padding:2px 0 2px 18px}
.ph-crumb{margin:0;font-size:12.5px;font-weight:600;color:var(--ink-3);letter-spacing:.01em}
.ph-crumb b{color:var(--ink-3);font-weight:600;margin-right:8px}.ph-crumb span{color:var(--ink-2)}
.ph-q{margin:6px 0 2px;font-size:18px;line-height:1.35;font-weight:500;color:var(--ink-2)}
.ph-a{margin:0;font-size:30px;line-height:1.22;font-weight:600;letter-spacing:-.018em;color:var(--ink);max-width:68ch;text-wrap:pretty}
@media(min-width:1800px){.ph-a{font-size:34px}}
/* ---------- metric strip: one step below the answer ---------- */
.b-metrics,.revenue-metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin:0 0 18px;padding:12px 0 14px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.revenue-metrics{grid-template-columns:repeat(3,minmax(0,1fr))}
.b-metrics>div,.revenue-metric{padding:0 20px;border-left:1px solid var(--rule);min-width:0}
.b-metrics>div:first-child,.revenue-metric:first-child{padding-left:0;border-left:0}
.b-metrics span,.revenue-metric>span{display:block;font-size:12.5px;font-weight:500;color:var(--ink-3)}
.b-metrics strong,.revenue-metric>strong{display:block;font-size:24px;font-weight:600;letter-spacing:-.015em;line-height:1.25;margin:3px 0 2px;color:var(--ink);white-space:nowrap}
.b-metrics strong small{font-size:12.5px;font-weight:500;color:var(--ink-3);letter-spacing:0;margin-left:4px}
.b-metrics p,.revenue-metric p{font-size:12px;color:var(--ink-3);margin:0}
.b-metrics .ans-k strong{color:var(--accent)}
/* ---------- tabs: one 16:9 screen per view ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin:0 0 16px}
.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 16px;font-size:14px;font-weight:600;color:var(--ink-3);cursor:pointer;display:flex;align-items:baseline;gap:8px}
.tab small{font-size:12px;font-weight:500;color:var(--ink-3)}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink)}
/* ---------- grid, sections, panels ---------- */
.b-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;align-items:stretch}
.b-grid+.b-grid,.b-grid+.b-section,.b-section+.b-grid,.b-grid+.s-panel,.s-panel+.b-grid,.s-panel+.s-panel,.b-grid+.drv-t,.b-grid+.nx,.drv-t+.nx,.eq+.b-grid{margin-top:16px}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.b-section{display:flex;align-items:baseline;gap:12px;margin:24px 0 12px}
.b-section h2{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.b-section .meta{font-size:12.5px}.b-section .rule{flex:1;border-top:1px solid var(--rule)}
.s-panel,.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);min-width:0}
.s-panel{padding:18px 20px;display:flex;flex-direction:column}
.s-panel h3,.panel h2,.panel-title h2{margin:0;font-size:16px;font-weight:600;letter-spacing:-.005em;color:var(--ink)}
.s-panel>.meta,.panel-title p{display:block;margin-top:3px;font-size:12.5px;color:var(--ink-3)}
.meta{font-size:12px;color:var(--ink-3)}
.note,.b-note{font-size:12.5px;color:var(--ink-2);margin:10px 0 0;line-height:1.55}
.ans{color:var(--accent)}
.why{font-style:normal;color:var(--ink-2)}
b,strong{font-weight:600}
sup.fn{font-size:11px;line-height:0;margin-left:1px;vertical-align:super}
sup.fn a{color:var(--ink-3);text-decoration:none}sup.fn a:hover{color:var(--ink)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:baseline;flex-shrink:0}
.s-legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:12px;color:var(--ink-2)}
.s-legend span{display:inline-flex;align-items:center}
.sub-h{font-size:14px;font-weight:600;margin:0 0 2px;color:var(--ink)}
/* ---------- charts ---------- */
.cbox{overflow-x:auto;margin-top:12px}.cbox>.s-svg{width:100%;height:auto;display:block}
.s-scroll{overflow-x:auto;margin-top:12px}
.s-svg{display:block;width:100%;height:auto;overflow:visible}
.s-svg text{font-family:var(--f);font-size:12px;fill:var(--ink-2)}
.s-svg .slab{fill:var(--ink);font-size:12.5px}.s-svg .slab-b{fill:var(--ink);font-size:12.5px;font-weight:600}
.s-svg .smut{fill:var(--ink-3);font-size:11.5px}.s-svg .smono{font-size:11.5px;fill:var(--ink-3)}
.s-svg .sfig{font-weight:600;fill:var(--ink)}
.s-svg .sgrid{stroke:var(--rule);stroke-width:1}.s-svg .saxis{stroke:var(--axis);stroke-width:1}
.plot text{font-family:var(--f);font-size:11.5px;fill:var(--ink-3)}
.small-plot .plot text{font-size:12px}
.plot .gridline{stroke:var(--rule)}
.bar-total-label{fill:var(--ink)!important;font-weight:600}
/* ---------- tables ---------- */
.s-tw{overflow-x:auto;margin-top:10px}
.s-table{border-collapse:collapse;width:100%;font-size:12.5px}
.s-table th{font-size:11.5px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink-3);text-align:left;padding:0 8px 7px;border-bottom:1px solid var(--rule-2);white-space:nowrap;background:none}
.s-table td{padding:8px;border-bottom:1px solid var(--rule);vertical-align:middle;color:var(--ink-2);text-align:left}
.s-table td:first-child,.s-table th:first-child{padding-left:0}
.s-table td.r,.s-table th.r{text-align:right;white-space:nowrap}.s-table td.r{color:var(--ink)}
.s-table tr.em td{color:var(--ink);font-weight:600}
.s-table tr:last-child td{border-bottom:0}
th{text-transform:none!important;letter-spacing:0!important}
.audit-table th,.duration-table th,.matrix th,.ramp-table th{font-size:11.5px!important;font-weight:600;color:var(--ink-3)}
.s-ptable td{white-space:nowrap}
.s-ptable tr.fam td{font-size:11.5px;font-weight:600;color:var(--ink-3);padding:12px 0 4px;border-bottom:0}
.s-ptable tr.out td{color:var(--ink-3)}
.pn{display:inline-flex;align-items:center}
.pcell{display:inline-grid;grid-template-columns:120px 46px;align-items:center;column-gap:10px}
.pbar{display:block;width:120px;height:8px;background:var(--n1);border-radius:2px;overflow:hidden}.pbar i{display:block;height:100%}
.pcell .sfigc{text-align:right}
.sfigc{font-weight:600;color:var(--ink)}
/* ---------- reasoning on demand ---------- */
.whyd{margin-top:10px;font-size:12.5px}
.whyd>summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:7px;color:var(--ink-2);font-weight:500;font-size:12.5px;padding:3px 0}
.whyd>summary::-webkit-details-marker{display:none}
.whyd>summary::before{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .18s}
.whyd[open]>summary::before{transform:rotate(45deg)}
.whyd>summary:hover{color:var(--ink)}
.whyd-b{margin-top:6px;padding:12px 14px;background:var(--sunk);border-radius:6px}
.wr{display:grid;grid-template-columns:max-content 1fr;gap:8px 18px;margin:0;font-size:12.5px;line-height:1.55}
.wr dt{font-weight:600;color:var(--ink);white-space:nowrap}.wr dd{margin:0;color:var(--ink-2)}
/* ---------- calculation ledger ---------- */
.s-ldg{margin-top:12px;border-top:1px solid var(--rule-2);display:flex;flex-direction:column;flex:1}
.s-lr{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--rule);font-size:12.5px}
.s-lr .op{color:var(--ink-3);text-align:center}
.s-lr .lb{color:var(--ink-2)}.s-lr .lb small{display:block;font-size:11.5px;color:var(--ink-3);line-height:1.4;margin-top:1px}
.s-lr .vl{font-weight:600;text-align:right;white-space:nowrap;color:var(--ink)}
.s-lr.tot{margin-top:auto;background:var(--sunk);border-bottom:0;padding:9px 12px 9px 10px;border-left:3px solid var(--ink);border-radius:0 6px 6px 0}
.s-ldg>.s-lr.tot{margin-top:auto}
.s-ldg>.s-lr:nth-last-child(2){margin-bottom:10px}
.s-lr.tot .lb{color:var(--ink);font-weight:600;white-space:nowrap}.s-lr.tot .vl{font-size:18px;font-weight:600}
.s-lr.tot.ans-t{border-left-color:var(--accent);background:var(--accent-soft)}.s-lr.tot.ans-t .vl{color:var(--accent)}
/* ---------- schedule grid ---------- */
.s-sg2{display:grid;grid-template-columns:150px repeat(16,minmax(24px,1fr)) 44px;gap:3px;font-size:11.5px;align-items:center;min-width:620px}
.s-sg2 .h{font-size:11px;color:var(--ink-3);text-align:center}.s-sg2 .h.r{text-align:right}
.s-sg2 .yr{grid-column:span 4;font-size:11.5px;color:var(--ink-2);text-align:center;border-bottom:1px solid var(--rule-2);padding-bottom:2px}
.s-sg2 .rl{font-size:12.5px;display:flex;align-items:center;white-space:nowrap;color:var(--ink)}
.s-sg2 .c{height:28px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:11px}
.s-sg2 .c.nil{border:1px solid var(--rule-2);color:var(--ink-3);background:none}
.s-sg2 .tt{text-align:right;font-weight:600;color:var(--ink);font-size:14px}
/* ---------- revenue equation ---------- */
.eq{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:20px 22px}
.eq-row{display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr auto 1.1fr;align-items:stretch;gap:0;margin-top:14px}
.eq-op{display:flex;align-items:center;justify-content:center;width:34px;font-size:22px;font-weight:500;color:var(--ink-3)}
.eq-f{border:1px solid var(--rule);border-radius:6px;padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:4px}
.eq-f .k{font-size:12px;font-weight:600;color:var(--ink-3)}
.eq-f .v{font-size:22px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.eq-f .d{font-size:12.5px;color:var(--ink-2);line-height:1.45}
.eq-f.res{background:var(--sunk);border-color:var(--rule-2)}
.eq-f.res .v{font-size:24px}
.eq-cap{font-size:13.5px;color:var(--ink-2);margin:4px 0 0}
.eq-foot{display:flex;gap:28px;margin-top:14px;padding-top:12px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--ink-2)}
.eq-foot b{color:var(--ink)}
/* ---------- driver table ---------- */
.drv-t{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:18px 20px}
.drv-t table{width:100%;border-collapse:collapse;margin-top:10px}
.drv-t th{font-size:11.5px;font-weight:600;color:var(--ink-3);text-align:left;padding:0 14px 8px 0;border-bottom:1px solid var(--rule-2)}
.drv-t td{vertical-align:top;padding:12px 14px 12px 0;border-bottom:1px solid var(--rule);font-size:12.5px;line-height:1.5;color:var(--ink-2)}
.drv-t tr:last-child td{border-bottom:0}
.drv-t td.nm{white-space:nowrap}.drv-t td.nm b{display:block;font-size:13.5px;color:var(--ink)}
.drv-t .lift{display:inline-flex;align-items:center;font-size:11.5px;color:var(--ink-3);margin-top:3px}
.drv-t .mv{white-space:nowrap}.drv-t .mv b{font-size:15px;color:var(--ink)}
.dumb{display:block;margin-top:6px}
/* ---------- cash: chart and its breakdown ---------- */
.grp-h{display:flex;align-items:baseline;gap:10px;margin:18px 0 10px}
.grp-h h3{margin:0;font-size:15px;font-weight:600;color:var(--ink)}
.grp-h .tot{font-size:15px;font-weight:600;color:var(--ink)}
.grp-h .meta{font-size:12.5px}
.grp-h .rule{flex:1;border-top:1px solid var(--rule)}
.cc3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch}
.s-cc{background:var(--surface);border:1px solid var(--rule);border-top:4px solid var(--cc,var(--rule-2));border-radius:var(--r);padding:14px 18px 16px;min-width:0;display:flex;flex-direction:column}
.s-cc .ct{display:flex;align-items:center;justify-content:space-between;gap:8px}
.s-cc h4{margin:0;font-size:15px;font-weight:600;color:var(--ink)}
.s-cc .feeds{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.s-cc .whyd{margin-top:8px}
/* ---------- guide ---------- */
.gd{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:stretch}
.demo{position:relative;background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);padding:20px 22px 18px;margin-top:14px}
.demo .ph-main{padding-left:14px}
.demo .ph-crumb{font-size:11.5px}.demo .ph-q{font-size:14px}.demo .ph-a{font-size:21px}
.demo .b-metrics{grid-template-columns:repeat(3,1fr);margin:14px 0 12px}.demo .b-metrics strong{font-size:18px}
.demo-chart{display:flex;align-items:flex-end;gap:5px;height:66px;padding:0 2px;border-bottom:1px solid var(--rule-2)}
.demo-chart i{flex:1;border-radius:2px 2px 0 0;background:linear-gradient(to top,var(--tile) 0 40%,var(--wood) 40% 70%,var(--upvc) 70%)}
.demo-why{margin-top:10px;font-size:12.5px;color:var(--ink-2)}
.co{position:absolute;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;font-style:normal;box-shadow:0 0 0 3px var(--paper)}
.gl{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:12px}
.gl li{display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:start}
.gl .n{width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
.gl b{display:block;font-size:14px;color:var(--ink)}.gl span{font-size:12.5px;color:var(--ink-2)}
.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.key{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.key h4{margin:0;font-size:14px;font-weight:600;color:var(--ink)}
.key .rule-l{font-size:12.5px;color:var(--ink-2);margin:0}
.key .chips{display:flex;flex-direction:column;gap:7px;font-size:12.5px;color:var(--ink)}
.key .chip{display:flex;align-items:center;gap:8px}.key .chip i{width:14px;height:14px;border-radius:3px;flex-shrink:0}
.gloss{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 28px;margin:12px 0 0}
.gloss div{display:grid;grid-template-columns:72px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:12.5px}
.gloss dt{font-weight:600;color:var(--ink)}.gloss dd{margin:0;color:var(--ink-2)}
/* ---------- next strip, notes ---------- */
.nx{display:flex;align-items:stretch;border:1px solid var(--rule);border-radius:var(--r);background:var(--surface);overflow:hidden}
.nx-l{display:flex;align-items:center;padding:0 18px;font-size:12px;font-weight:600;color:var(--ink-3);background:var(--sunk);white-space:nowrap}
.nx a{flex:1;padding:12px 16px;border-left:1px solid var(--rule);text-decoration:none;display:flex;flex-direction:column;gap:2px}
.nx a b{font-size:13px;color:var(--ink)}.nx a span{font-size:12px;color:var(--ink-3)}.nx a:hover{background:var(--sunk)}
.b-notes{margin-top:20px;border-top:1px solid var(--rule);padding-top:12px;font-size:12px;color:var(--ink-2)}
.b-notes summary{cursor:pointer;font-weight:600;color:var(--ink)}
.b-notes ol{columns:2;column-gap:40px;margin:10px 0 0;padding-left:20px;line-height:1.55}.b-notes li{break-inside:avoid;margin-bottom:4px;padding:1px 3px;border-radius:3px}
.flash{background:var(--accent-soft)!important;transition:background .3s}
.s-banner{background:var(--accent-soft);border:1px solid #F0C9B8;border-radius:6px;padding:9px 14px;font-size:13px;margin:0 0 14px}.s-banner a{color:var(--accent)}
.page-footer{font-size:11.5px;color:var(--ink-3)}
/* ---------- inputs ---------- */
.s-inbar{position:sticky;top:8px;z-index:5}
.s-sum{display:grid;grid-template-columns:repeat(6,1fr)}.s-sum>div{padding:0 14px;border-left:1px solid var(--rule)}.s-sum>div:first-child{border-left:0;padding-left:0}
.s-sum span{display:block;font-size:12px;color:var(--ink-3)}.s-sum b{font-size:22px;font-weight:600;color:var(--ink)}
.s-inactions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.s-inactions button,.s-file{font:inherit;font-size:13px;border:1px solid var(--rule-2);background:#fff;border-radius:6px;padding:7px 12px;cursor:pointer;color:var(--ink)}
.s-inactions button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.s-file input{display:none}
.s-ingrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 22px;margin-top:10px}
.s-in{display:grid;grid-template-columns:1fr 100px;gap:2px 10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--rule)}
.s-in .l{font-size:13px;color:var(--ink)}.s-in .l small{display:block;font-size:11.5px;color:var(--ink-3)}
.s-in .d{grid-column:2;font-size:11px;color:var(--ink-3);text-align:right}
.s-in input,.s-intable input{font:inherit;font-size:14px;font-weight:600;text-align:right;width:100%;border:1px solid var(--rule-2);border-radius:6px;padding:4px 8px;background:#fff;color:var(--ink)}
.s-intable input{width:84px}
.s-in.changed input,.s-intable input.changed{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
/* ---------- original dashboard pages, brought onto the system ---------- */
.page-head h1{font-size:30px;font-weight:600}
.panel-title{padding:16px 20px 0}.panel-body{padding:12px 20px 16px}
.chart-legend,.legend{font-size:12px;color:var(--ink-2)}
.chart-readout{font-size:12.5px;background:var(--sunk);border-top:1px solid var(--rule)}
.duration-table td,.audit-table td{color:var(--ink-2)}
.duration-table tr.emphasis td{color:var(--ink);font-weight:600}
.period-current{background:var(--sunk)!important;color:var(--ink)!important}
.cell{background:rgba(20,20,19,calc(var(--heat,0)*.62))!important;color:var(--ink)}
.cell[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:-2px}
.heat-legend i{background:rgba(20,20,19,calc(var(--heat)*.62))!important}
.selected-unit th{background:var(--sunk)}
.matrix .group th{font-size:12px;font-weight:600;color:var(--ink-2);background:var(--sunk)}
.inspector{border-left:1px solid var(--rule)}
.inspect-value{font-size:26px;font-weight:600;color:var(--ink)}
.product-panel{border-radius:var(--r);border-color:var(--rule)}
.product-panel.selected{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.product-header h2{font-size:16px}
.product-header strong{font-size:20px;font-weight:600;color:var(--ink)}
p.product-meta{font-size:12px;color:var(--ink-3)}
.coverage-label b,.coverage-label span{font-size:11.5px!important}
.coverage-track{background:var(--n1)}
.entry-chain div{background:var(--sunk);font-size:11.5px!important}
.entry-chain strong{font-size:14px;color:var(--ink)}
.formula{background:var(--sunk);color:var(--ink-2);font-size:12px}
.ramp-table{table-layout:auto}.ramp-table th:first-child,.ramp-table td:first-child{width:130px;min-width:130px;white-space:nowrap;text-align:left}
.barcell i{background:var(--n3)!important}
.model-spine b,.section-number{background:var(--ink)!important;color:#fff!important}
.model-spine span{font-size:12px}
.registry-row{font-size:11.5px!important}.registry-row>span{width:150px;white-space:nowrap}
.registry-row button{font-size:11.5px;padding:3px 7px;border-radius:4px;background:var(--sunk)}
.registry-row button[aria-pressed=true]{background:var(--ink);color:#fff}
.timing-row{grid-template-columns:118px 1fr 1fr 52px;font-size:12px}
.timing-row .rule-product{white-space:nowrap}
.timing-row>span:not(:first-child){font-size:11.5px!important;background:var(--sunk)}
.audit-selectors{grid-template-columns:1.2fr 1fr}.audit-selectors label{font-size:11.5px!important}
.unit-mrr-total{background:var(--ink)!important}
.aggregate-chain,.aggregate-chain span,.status-line{font-size:11.5px!important}
.aggregate-equation{background:var(--sunk)!important;color:var(--ink)}
.status-dot{background:var(--upvc)}
.text-button,.reading-links a{color:var(--ink-2)}
.duration-table th small,.revenue-detail-table th small{font-size:11px}
.revenue-detail-table tr>*:first-child{width:185px;min-width:185px}
.revenue-detail-table th[scope=row],.revenue-detail-table th[scope=row] span,.split-row th{white-space:nowrap}
.footnotes{font-size:12px;color:var(--ink-3)}
/* ---------- motion: stage the page, reveal on scroll ---------- */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes drop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.enter .ph{animation:rise .42s cubic-bezier(.2,.7,.2,1) both}
.enter .b-metrics,.enter .revenue-metrics{animation:rise .42s .12s cubic-bezier(.2,.7,.2,1) both}
.enter .tabs{animation:fade .3s .2s both}
.enter .stage3{animation:rise .48s .24s cubic-bezier(.2,.7,.2,1) both}
.enter-tab .tabpanel{animation:rise .32s cubic-bezier(.2,.7,.2,1) both}
.enter .revenue-bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .55s cubic-bezier(.2,.7,.2,1) both}
.enter .bar-total-label,.enter .bar-segment-label{animation:fade .3s .7s both}
.rv{opacity:0;transform:translateY(10px);transition:opacity .4s ease,transform .4s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.whyd[open]>.whyd-b{animation:drop .22s ease-out}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
@media print{.rv{opacity:1!important;transform:none!important}*{animation:none!important}.tabs{display:none}.tabpanel[hidden]{display:block!important}}
/* ---------- responsive ---------- */
@media (max-width:1300px){.c3,.c4,.c5{grid-column:span 6}.c7,.c8{grid-column:span 12}.keys{grid-template-columns:repeat(2,1fr)}.s-ingrid{grid-template-columns:repeat(3,1fr)}.cc3{grid-template-columns:1fr 1fr}}
@media (max-width:900px){.c3,.c4,.c5,.c6{grid-column:span 12}.b-metrics{grid-template-columns:1fr 1fr}.gd,.keys,.cc3,.gloss{grid-template-columns:1fr}.eq-row{grid-template-columns:1fr}.eq-op{width:auto;height:24px}}

.b-grid>.s-panel,.b-grid>div{margin-top:0}
.revenue-metrics{margin:0 0 16px;padding-bottom:14px;gap:24px}
.revenue-metric>strong{font-size:24px;margin:4px 0 2px;letter-spacing:-.01em}
.revenue-metric>p{font-size:11.5px}
.gd>.s-panel,.cc3>.s-cc{margin-top:0}
.drv-t th,.drv-t td{text-align:left;vertical-align:top}
.drv-t td.mv{white-space:nowrap}
.product-header small,.heat-legend{font-size:11.5px!important}
.drv-t th{background:none!important}

/* ====================== v7: report style ====================== */
/* header: a report's section opening, no card, no tags */
.ph{background:none;border:0;border-bottom:1px solid var(--rule-2);border-radius:0;box-shadow:none;padding:4px 0 18px;margin:0 0 18px;align-items:flex-start}
.ph-main{border-left:3px solid var(--accent);padding:0 0 0 18px;min-width:0}
.ph-crumb{margin:0 0 6px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.ph-crumb b{color:var(--accent);margin-right:8px}
.ph-q{margin:0 0 4px;font-size:20px;line-height:1.35;font-weight:500;color:var(--ink-2)}
.ph-a{font-size:30px;line-height:1.25}
@media(min-width:1800px){.ph-q{font-size:21px}}
.ph .s-edit{flex-shrink:0}

/* key figures: one framed band, cells divided by rules */
.b-metrics,.revenue-metrics{display:grid;grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:0;background:var(--surface);border:1px solid var(--rule-2);border-radius:4px;padding:14px 0;margin:0 0 20px}
.b-metrics>div,.revenue-metric,.b-metrics>div:first-child,.revenue-metric:first-child{background:none;border:0;border-left:1px solid var(--rule);border-radius:0;box-shadow:none;padding:0 24px}
.b-metrics>div:first-child,.revenue-metric:first-child{border-left:0}
.b-metrics>div.ans-k{background:none}
.b-metrics span,.revenue-metric>span{color:var(--ink-2)}
.b-metrics strong small{margin-left:6px}

/* sections within a page: report-style section tabs */
.tabs{display:flex;align-items:stretch;gap:28px;border:0;border-bottom:1px solid var(--rule-2);margin:0 0 18px}
.tabs-l{align-self:center;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding-right:4px}
.tabs .tab,.tabs .tab:hover,.tabs .tab:focus,.tabs .tab:active{appearance:none;display:flex;align-items:baseline;gap:8px;background:none!important;border:0!important;border-bottom:2px solid transparent!important;border-radius:0!important;box-shadow:none!important;margin:0 0 -1px;padding:10px 0 9px;font-size:15px;font-weight:500;color:var(--ink-3);cursor:pointer;transform:none}
.tabs .tab .tn{font-size:12.5px;font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tabs .tab:hover:not([aria-selected=true]){color:var(--ink);border-bottom-color:var(--rule-2)!important}
.tabs .tab[aria-selected=true]{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)!important}
.tabs .tab[aria-selected=true] .tn{color:var(--accent)}
.tabs .tab:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.tab-next-w{display:flex;justify-content:flex-end;margin-top:22px;padding-top:12px;border-top:1px solid var(--rule-2)}
.tab-next{appearance:none;background:none!important;border:0!important;padding:4px 0;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;text-decoration:underline;text-decoration-color:var(--rule-2);text-underline-offset:4px}
.tab-next:hover{text-decoration-color:var(--ink)}

/* section headings: a report rule above, never a lone label on grey */
.b-section{margin:28px 0 12px}
.b-section h2{font-size:20px}
.grp{background:none;border:0;border-top:2px solid var(--ink);border-radius:0;padding:10px 0 0;margin-top:28px}
.grp-h{display:flex;align-items:baseline;gap:14px;margin:0 0 12px;padding:0}
.grp-k{display:none}
.grp-e{margin:0;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.grp-h h3{margin:3px 0 0;font-size:20px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.grp-n{margin-left:auto;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.grp+.whyd,.grp+details{margin-top:10px}

/* cash cards: a coloured rule that matches the chart, the result first, then the working */
.s-cc{border:1px solid var(--rule);border-top:3px solid var(--cc);border-radius:4px;box-shadow:none;padding:14px 18px 16px}
.s-cc .ct{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.s-cc .feeds{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.s-cc .hl{display:flex;align-items:baseline;gap:8px;margin-top:14px}
.s-cc .hl strong{font-size:28px;font-weight:600;letter-spacing:-.015em;color:var(--ink);line-height:1.1}
.s-cc .hl span{font-size:13px;color:var(--ink-3)}
.s-cc .hs{margin:4px 0 0;font-size:13px;color:var(--ink-2);line-height:1.45;min-height:38px}
.s-cc .strip{display:flex;gap:2px;height:8px;margin-top:10px}.s-cc .strip i{border-radius:2px}
.s-cc .strip-l{margin:4px 0 0;font-size:11.5px;color:var(--ink-3)}
.s-cc .how{margin:14px 0 0;font-size:11.5px;font-weight:600;color:var(--ink-3);letter-spacing:.02em}
.s-cc .s-ldg{margin-top:6px;flex:0}

/* equation: formula band, then a picture inside each box */
.eq-band{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin-top:12px;padding:16px 20px;background:var(--sunk);border-radius:8px;font-size:19px;color:var(--ink)}
.eq-band .lhs{font-weight:500}
.eq-band b{font-weight:500;color:var(--ink-3);font-size:22px}
.eq-band .t{background:#fff;border:1px solid var(--rule-2);border-radius:6px;padding:4px 12px;font-weight:600}
.eq-band .t.age{border:2px solid var(--ink)}
.eq-age{margin:10px 0 0;font-size:13.5px;color:var(--ink-2);line-height:1.5}.eq-age b{color:var(--ink)}
.eq-ex{margin:16px 0 0;font-size:13.5px;font-weight:600;color:var(--ink)}
.eq-row{margin-top:10px}
.eq-f{gap:2px}
.eq-f .vis{height:64px;display:flex;align-items:flex-end;margin:10px 0 8px}
.eq-f .d{font-size:12px;color:var(--ink-3)}
.u-grid{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:2px;width:100%}
.u-grid i{aspect-ratio:1;border-radius:1.5px;background:#F3E8D2}
.u-grid i.d{background:#DCE8E2}
.u-grid i.live{box-shadow:inset 0 0 0 1.5px var(--ink)}
.u-grid i.me{background:#B08A47;box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--ink)}
.vm{display:flex;align-items:flex-end;gap:12px}
.vm .sq{display:block;background:#EAD7AE;border-radius:2px}
.vm .sq.ghost{background:none;border:1.5px dashed #B58C4E;position:relative}
.vm .sq.ghost span{position:absolute;left:calc(100% + 8px);bottom:0;font-size:11.5px;color:var(--ink-3);white-space:nowrap;font-style:normal}
.vp{display:grid;gap:8px;width:100%}
.vp>div{display:grid;grid-template-columns:38px minmax(0,1fr) 42px;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.vp em{font-style:normal;font-weight:600;color:var(--ink);text-align:right}
.trk{display:block;height:10px;background:#EEECE4;border-radius:3px;overflow:hidden}.trk i{display:block;height:100%;border-radius:3px}
.vs{display:flex;align-items:flex-end;gap:6px;height:100%;width:100%}
.vs span{flex:1;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-end;height:100%;gap:3px}
.vs i{display:block;background:var(--n2,#D6D3C8);border-radius:2px 2px 0 0}
.vs span.on i{background:var(--ink)}
.vs em{font-style:normal;font-size:11px;color:var(--ink-3);text-align:center;line-height:1}
.vs span.on em{color:var(--ink);font-weight:600}
.vb{width:100%;display:flex;flex-direction:column;gap:8px}
.vb .trk{height:14px}.vb .trk i{background:#5F7F3A}
.vb-l{font-size:12.5px;color:var(--ink-2);font-weight:500}
.eq-f.res{background:var(--accent-soft);border-color:#F0C9B8}
.eq-f.res .v{color:var(--accent)}

/* the age walk */
.age{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:0}
.age li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--rule)}
.age li:last-child{border-bottom:0}
.age .n{width:24px;height:24px;border-radius:50%;background:var(--sunk);border:1px solid var(--rule-2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--ink-2)}
.age .f{display:block;font-size:13.5px;font-weight:600;color:var(--ink)}
.age .x{display:block;font-size:13px;color:var(--ink-2);margin-top:2px}.age .x b{color:var(--ink)}
.age li.res{background:var(--sunk);border-radius:6px;padding:10px 10px;border-bottom:0;margin-top:6px}
.age li.res .n{background:var(--ink);color:#fff;border-color:var(--ink)}

/* how to read: layer and meaning on the same row */
.lay{margin-top:14px;border-top:1px solid var(--rule)}
.lay-r{display:grid;grid-template-columns:minmax(0,1.1fr) 44px minmax(0,1fr);align-items:center;gap:18px;padding:14px 0;border-bottom:1px solid var(--rule)}
.lay-r:last-child{border-bottom:0}
.lay-s{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:12px 16px;min-height:56px;display:flex;flex-direction:column;justify-content:center}
.lay-s .ph-crumb{font-size:11.5px;margin:0 0 6px}
.lay-s .ph-q{font-size:16px}.lay-s .ph-a{font-size:22px;margin:0;font-weight:600;color:var(--ink)}
.lay-s .b-metrics{grid-template-columns:repeat(3,1fr);margin:0}.lay-s .b-metrics strong{font-size:18px}
.lay-s .demo-chart{height:54px}
.lay-n{width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;justify-self:center;position:relative}
.lay-n::before{content:'';position:absolute;right:100%;top:50%;width:18px;border-top:1.5px dashed var(--ink-3)}
.lay-t b{display:block;font-size:15px;color:var(--ink)}.lay-t span{display:block;font-size:13px;color:var(--ink-2);margin-top:2px;line-height:1.5}
.key .chip svg{margin-right:0!important;flex-shrink:0}
.ramp-sw{width:14px;height:14px;border-radius:3px;flex-shrink:0;background:linear-gradient(90deg,#E8E6DC,#B0AEA5 50%,#3D3C38)}
@media (max-width:900px){.tabs{grid-template-columns:1fr}.ph-qa{grid-template-columns:1fr}.lay-r{grid-template-columns:1fr}.lay-n::before{display:none}}
.eq-band .t.age{padding:3px 11px}
.eq-band .t.age{border:1px solid var(--ink)!important;box-shadow:inset 0 0 0 1px var(--ink);padding:4px 12px!important}
.lay-s .tabs{margin:0;gap:22px}.lay-s .tabs .tab{cursor:default;font-size:13.5px;padding:6px 0}
.lay-s .ph-q{margin:0}
.lay-s .ph-a{border-left:3px solid var(--accent);padding-left:12px}
.lay-s .b-metrics{margin:0}

/* ====================== v8 ====================== */
/* formula boxes: text only */
.eq-f{padding:14px 16px 16px}
.eq-f .w{margin:10px 0 0;font-size:12.5px;line-height:1.5;color:var(--ink-2)}
.eq-f .w+.w{margin-top:6px}
.eq-f .w b{color:var(--ink);font-weight:600}
.eq-band .t{border:1px solid var(--rule-2)}
.eq-age{font-size:14px}

/* working out a line's age */
.age-walk{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column}
.age-walk li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--rule)}
.age-walk li:last-child{border-bottom:0}
.age-walk .n{width:24px;height:24px;border-radius:50%;background:var(--sunk);border:1px solid var(--rule-2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--ink-2)}
.age-walk .f{display:block;font-size:13.5px;font-weight:600;color:var(--ink)}
.age-walk .x{display:block;font-size:13px;color:var(--ink-2);margin-top:2px;line-height:1.5}.age-walk .x b{color:var(--ink)}
.age-walk li.res{background:var(--sunk);border-radius:6px;padding:10px;border-bottom:0;margin-top:6px}
.age-walk li.res .n{background:var(--ink);color:#fff;border-color:var(--ink)}

/* section headings carry a short meta */
.b-section .meta{font-size:12.5px;color:var(--ink-3)}

/* cost of revenue cards: what, why, then how it is sized */
.cc3.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.s-cc .cw{margin:8px 0 0;font-size:13px;line-height:1.5;color:var(--ink-2)}
.s-cc .cw b{color:var(--ink);font-weight:600}
.s-cc .hl{margin-top:10px}

/* how-to-read lines on interactive pages */
.how-read,.matrix-caption{margin:0 0 14px;padding:10px 14px;background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--ink-3);border-radius:4px;font-size:13px!important;line-height:1.55;color:var(--ink-2)!important;max-width:none}
.how-read b,.matrix-caption b{color:var(--ink)}

/* the financials sheet */
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.sheet-h button{flex-shrink:0;font-size:12.5px;font-weight:500;color:var(--ink);background:#fff;border:1px solid var(--rule-2);border-radius:6px;padding:7px 12px;cursor:pointer}
.sheet-w{overflow-x:auto;margin-top:12px;border:1px solid var(--rule-2);border-radius:4px}
.sheet{border-collapse:collapse;font-size:12px;table-layout:auto;font-variant-numeric:tabular-nums;width:max-content;min-width:100%}
.sheet th,.sheet td{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:5px 6px;text-align:right;white-space:nowrap;min-width:52px;color:var(--ink)}
.sheet thead th{background:var(--sunk);font-weight:600;font-size:12px;color:var(--ink);position:sticky;top:0;z-index:2;vertical-align:bottom}
.sheet thead th small{display:block;font-weight:400;font-size:11px;color:var(--ink-3)}
.sheet .lbl{position:sticky;left:0;z-index:1;background:#fff;text-align:left;min-width:190px;border-right:1px solid var(--rule-2)}
.sheet thead th.lbl{z-index:3;background:var(--sunk)}
.sheet th.set{background:#E9E6DC}
.sheet td.set{background:#FCFBF8}
.sheet .yr{background:var(--sunk);font-weight:600}
.sheet tr.b td{font-weight:600}
.sheet tr.pc td{color:var(--ink-3);font-style:italic}
.sheet tr.pc td.set{color:var(--ink);font-style:normal}
.sheet tr.pc td.lbl{color:var(--ink-3);padding-left:20px}
.sheet tr.sec td{background:#fff;text-align:left;padding:12px 8px 6px;border-bottom:1px solid var(--rule-2)}
.sheet tr.sec td b{font-size:13px;color:var(--ink);margin-right:10px}
.sheet tr.sec td span{font-size:11.5px;color:var(--ink-3)}

/* ====================== v9: brand palette and type ====================== */
/* families: Poppins for headings and key figures, Lora for prose, Plex for data */
.ph-a,.ph-crumb,.b-section h2,.s-panel h3,.s-panel h4,.sub-h,.key h4,.b-metrics strong,.revenue-metric>strong,.brand strong,.eq-f .v,.eq-band,.s-cc h4,.s-cc .hl strong,.grp-h h3,.panel-title h2,.product-header h2,.product-header strong,.tab-next,.nx b,.lay-t b,.drv-t h3,.unit-mrr-total strong,.aggregate-equation strong{font-family:var(--fd)}
.ph-a{font-weight:500;letter-spacing:-.015em;font-size:29px;line-height:1.28}
.b-section h2{font-weight:500;letter-spacing:-.01em}
.s-panel h3,.sub-h,.drv-t h3{font-weight:500;font-size:16px;letter-spacing:-.005em}
.b-metrics strong,.revenue-metric>strong{font-weight:500;letter-spacing:-.01em}
.eq-f .v,.s-cc .hl strong{font-weight:500}
.grp-h h3{font-weight:500}
.ph-q,.how-read,.note,.eq-f .w,.s-cc .cw,.age-walk .x,.lay-t span,.key .rule-l,.gloss dd,.eq-ex,.about-p,.pages-t td,.drv-t td:not(.nm):not(.mv),.product-explain p,.whyd-b,.wr,.how-inline,.matrix-caption{font-family:var(--ft)}
.drv-t td:not(.nm):not(.mv){font-size:13px}

/* the question is the highlight; the answer carries its figures in the same colour */
.ph-q{font-style:italic;font-weight:500;font-size:21px;color:var(--accent);margin:2px 0 6px}
.ph-main{border-left-color:var(--accent-fill)}
.ph-crumb b{color:var(--accent)}
.ph-a .hl,.lay-s .hl{color:var(--accent)}
.acc{color:var(--accent)!important}
.b-metrics>div.ans-k{background:var(--accent-soft)}
.b-metrics .ans-k strong{color:var(--accent)}

/* how to read: on every chart and table */
.how-read{margin:10px 0 14px;padding:10px 14px;background:var(--paper);border:1px solid var(--rule);border-left:3px solid var(--accent-fill);border-radius:4px;font-size:13.5px;line-height:1.55;color:var(--ink-2)}
.how-read p{margin:0}.how-read p+p{margin-top:3px}
.how-read b{color:var(--ink);font-weight:600}
.matrix-caption{border-left-color:var(--accent-fill)!important;background:var(--paper)!important;font-size:13.5px!important}
.how-inline{font-size:13px;color:var(--ink-2);line-height:1.5;max-width:110ch}
.how-inline b{color:var(--ink)}
.b-section+.how-read{margin-top:0}
.drv-wrap{margin-top:16px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:16px 20px 4px}
.drv-wrap .drv-t{border:0;padding:0;background:none}
.drv-wrap>.how-read{margin-top:0}
.sub-h{margin-bottom:0}

/* page 01: the timing parts sit inside the size cards */
.two-up{grid-template-rows:auto auto}
.two-up>.s-panel{display:grid;grid-row:span 2;grid-template-rows:subgrid;row-gap:0}
.in-part{margin-top:18px;padding-top:16px;border-top:1px solid var(--rule)}
.in-part h4{margin:0;font-size:15px;font-weight:500;color:var(--ink)}
.in-part .meta{margin:2px 0 8px}

/* sheet: years grouped, totals set apart */
.sheet th.grp{text-align:center;font-size:12px;font-weight:600;background:var(--sunk);border-bottom:1px solid var(--rule-2)}
.sheet th.grp.tot{background:#E9E5DA}
.sheet .gap{min-width:14px!important;width:14px;padding:0;background:var(--paper)!important;border-top:0;border-bottom:0;border-right:1px solid var(--rule-2)}
.sheet thead th.gap{background:var(--paper)!important}
.sheet .ys{border-left:2px solid var(--rule-2)}
.sheet tr.sec td.lbl{background:#fff}

/* how to read page */
.about-p{margin:0 0 12px;font-size:15px;line-height:1.6;color:var(--ink);max-width:110ch}
.pages-t td{vertical-align:top;font-size:13.5px;color:var(--ink-2);text-align:left}
.pages-t th{text-align:left}
.pages-t td:first-child{white-space:nowrap;font-family:var(--fd);font-size:13.5px}
.pages-t td:first-child a{color:var(--ink);text-decoration:none}.pages-t td:first-child a:hover{text-decoration:underline}
.pages-t td:first-child b{color:var(--accent);font-weight:600;margin-right:4px}
.pages-t td.q{font-style:italic;color:var(--accent)}
.lay-s{background:none!important;border:0!important;padding:4px 0!important;min-height:0}
.lay-s .how-read{margin:0}
.lay-s .ph-q{font-size:17px;margin:0}
.lay-s .ph-a{font-size:22px;border-left:3px solid var(--accent-fill);padding-left:12px;margin:0}
.lay-s .b-metrics{margin:0}

/* the brand ramp swatch */
.ramp-sw{background:linear-gradient(90deg,#E8E6DC,#B0AEA5 50%,#3D3C38)!important}
/* Lora's tabular feature widens bold word spaces: prose does not need it */
.ph-q,.how-read,.how-read *,.note,.eq-f .w,.eq-f .w *,.s-cc .cw,.s-cc .cw *,.age-walk .x,.lay-t span,.key .rule-l,.gloss dd,.eq-ex,.about-p,.pages-t td,.drv-t td,.drv-t td *,.product-explain p,.whyd-b,.wr,.wr *,.how-inline,.how-inline *,.matrix-caption,.matrix-caption *{font-feature-settings:normal}
.b-metrics{padding:0;overflow:hidden}
.b-metrics>div,.b-metrics>div:first-child{padding:14px 24px}
.drv-wrap .how-read{margin:12px 0 4px}
.drv-wrap{padding-bottom:4px}

/* ====================== v10 ====================== */
/* the product filter is not needed: every page shows all five lines */
.global-controls{display:none!important}
.ph{padding-top:6px}

/* sections: one at a time under the same heading */
/* sections: a three-step process bar; the current step carries the accent */
.stepbar{display:flex;align-items:center;gap:20px;margin:6px 0 20px}
.stepbar ol{list-style:none;margin:0;padding:0;display:flex;flex:1;min-width:0}
.stepbar li{flex:1 1 0;min-width:0;margin-left:-8px}
.stepbar li:first-child{margin-left:0}
.stepbar li button{appearance:none;width:100%;height:54px;display:flex;align-items:center;gap:12px;margin:0;cursor:pointer;text-align:left;
  background:#ECEAE2!important;color:var(--ink-2);border:0!important;box-shadow:none!important;border-radius:0!important;padding:0 26px 0 34px!important;
  clip-path:polygon(0 0,calc(100% - 18px) 0,100% 50%,calc(100% - 18px) 100%,0 100%,18px 50%);transition:background .15s}
.stepbar li:first-child button{clip-path:polygon(0 0,calc(100% - 18px) 0,100% 50%,calc(100% - 18px) 100%,0 100%);border-radius:8px 0 0 8px!important;padding-left:18px!important}
.stepbar li button:hover{background:#E2DFD5!important;color:var(--ink)}
.stepbar .sn{flex:0 0 auto;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1.5px solid #B0AEA5;font-family:var(--fd);font-size:13px;font-weight:500;color:var(--ink-2);background:#FAF9F5}
.stepbar .st{font-family:var(--fd);font-size:16px;font-weight:500;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stepbar li.done button{background:#F4E2D8!important;color:var(--ink)}
.stepbar li.done button:hover{background:#EFD6C9!important}
.stepbar li.done .sn{background:var(--accent);border-color:var(--accent);color:#fff}
.stepbar li.on button{background:var(--accent)!important;color:#fff}
.stepbar li.on .sn{background:#fff;border-color:#fff;color:var(--accent)}
.stepbar li.on .st{font-size:17px;color:#fff}
.stepbar button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.step-hint{font-size:12.5px;color:var(--ink-3);white-space:nowrap;padding-bottom:4px}
.step-hint kbd{font-family:var(--f);font-size:11.5px;border:1px solid var(--rule-2);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:#fff;color:var(--ink-2)}
.step-nav{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:22px;padding-top:16px;border-top:1px solid var(--rule-2)}
.step-prev{appearance:none;background:none!important;border:0!important;font-size:13.5px;color:var(--ink-2);cursor:pointer;padding:6px 0;text-decoration:underline;text-decoration-color:var(--rule-2);text-underline-offset:4px}
.step-prev:hover{color:var(--ink)}
.step-next{appearance:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px;background:var(--ink)!important;color:#fff!important;border:0!important;border-radius:8px!important;padding:10px 18px;font-family:var(--fd);font-size:16px;font-weight:500;cursor:pointer}
.step-next small{font-family:var(--f);font-size:11.5px;font-weight:500;color:#D6D3C8;letter-spacing:.02em}
.step-next:hover{background:#3D3C38!important}
.enter-step .step.on{animation:rise .32s cubic-bezier(.2,.7,.2,1) both}
.step>.b-grid:first-child,.step>.eq:first-child,.step>.s-panel:first-child,.step>.how-read:first-child{margin-top:0}
@media (prefers-reduced-motion:reduce){.enter-step .step.on{animation:none}}

/* checks and worked example: larger, so they read as the payoff */
.ex-k{margin:0 0 4px;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.ex h3{font-size:20px!important}
.ex .s-ldg{margin-top:14px}
.ex .s-lr{font-size:14.5px;padding:11px 0;grid-template-columns:20px minmax(0,1fr) auto}
.ex .s-lr .lb small{font-size:12.5px}
.ex .s-lr .vl{font-size:16px}
.ex .s-lr.tot{padding:14px 16px 14px 14px;margin-top:14px}
.ex .s-lr.tot .lb{font-size:15px}
.ex .s-lr.tot .vl{font-size:28px;font-family:var(--fd);font-weight:500}
.ex .note{font-size:13.5px;margin-top:12px}
.ex-grid>.ex{border-top:3px solid var(--accent-fill)}
.mc-cap{margin:16px 0 6px;font-size:12.5px;color:var(--ink-3)}
.mc-bar{display:flex;gap:2px;height:22px}.mc-bar i{border-radius:2px}
.mc-list{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:10px}
.mc-list div{display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--ink-2)}
.mc-list div svg{margin-bottom:2px}
.mc-list b{font-size:14px;color:var(--ink);font-weight:600}

/* how to read: the logic line */
.how-read p+p{margin-top:4px}

/* how-to-read page placeholders: neutral, clearly not data */
.lay-s .ph-q{color:var(--accent)}
.ph-metrics strong{color:var(--ink-3)!important}
.ph-chart i{background:linear-gradient(to top,#B0AEA5 0 45%,#D6D3C8 45% 75%,#E8E6DC 75%)!important}
.ph-steps{margin:0}.ph-steps li button{cursor:default}
.ex .s-ldg{flex:0 0 auto}.ex .s-ldg>.s-lr.tot{margin-top:14px}

/* ====================== v11 ====================== */
/* "Where these come from" and every other source fold, in the highlight colour */
.whyd>summary{color:var(--accent)!important;font-weight:600}
.whyd>summary svg,.whyd>summary::before{color:var(--accent)}


/* page 01: key figures without sub-lines */
.b-metrics strong{margin-bottom:0}

/* line-age timeline */
.tl{display:grid;gap:0;margin:12px 0 0;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:#fff}
.tl-r{display:grid;grid-template-columns:150px repeat(6,minmax(0,1fr));align-items:center;border-top:1px solid var(--rule)}
.tl-r:first-child{border-top:0}
.tl-l{padding:8px 10px;font-size:12.5px;color:var(--ink-2);font-weight:500}
.tl-c{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 2px;font-size:12.5px;color:var(--ink-3);text-align:center;min-height:36px}
.tl-c b{color:var(--ink);font-weight:600}
.tl-c svg{margin:0!important}
.tl-h .tl-c{font-weight:600;color:var(--ink-2);background:var(--sunk);min-height:30px}
.tl-c.on{background:var(--accent-soft);box-shadow:inset 1px 0 0 #E6C3B1,inset -1px 0 0 #E6C3B1}
.tl-h .tl-c.on{background:#C15F3C;color:#fff}
.tl-s .tl-c{justify-content:flex-end;min-height:58px}
.tl-s .tl-c i{display:block;width:18px;background:#B0AEA5;border-radius:2px 2px 0 0}
.tl-s .tl-c.on i{background:var(--accent-fill)}
.tl-s .tl-c em{font-style:normal;font-size:12px;color:var(--ink);font-weight:600}
.tl-res{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-top:12px;padding:12px 14px;background:var(--sunk);border-left:3px solid var(--ink);border-radius:0 6px 6px 0}
.tl-res span{font-size:13px;color:var(--ink-2)}.tl-res b{font-family:var(--fd);font-weight:500;font-size:16px;color:var(--ink)}

/* today, traced: visual */
.tv{margin-top:6px}
.tv-top{display:flex;align-items:baseline;gap:10px}
.tv-top strong{font-family:var(--fd);font-weight:500;font-size:34px;color:var(--ink);letter-spacing:-.01em}
.tv-top span{font-size:13.5px;color:var(--ink-3)}
.tv-bar{display:flex;gap:2px;height:26px;margin-top:8px}.tv-bar i{border-radius:3px}
.tv-leg{display:flex;justify-content:space-between;gap:12px;margin-top:8px;font-size:13px;color:var(--ink-2)}
.tv-leg span{display:inline-flex;align-items:center;gap:2px}.tv-leg b{color:var(--ink);margin:0 4px}
.tv-step{margin:18px 0 12px;padding:10px 14px;background:var(--sunk);border-radius:6px;font-size:13.5px;color:var(--ink-2);display:flex;gap:10px;align-items:baseline}
.tv-step b{color:var(--ink)}.tv-arrow{font-size:18px;color:var(--ink-3)}
.tv-units{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:end}
.tv-u{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.tv-sq{border:2px solid var(--ink);border-radius:3px;margin-bottom:6px}
.tv-n{font-size:13.5px;font-weight:600;color:var(--ink);display:flex;align-items:center}
.tv-m,.tv-t{font-size:12.5px;color:var(--ink-3);display:flex;align-items:center;gap:2px}
.tv-t svg{margin-right:4px!important}

/* worked example icons */
.mc-icons{display:inline-flex;gap:2px;margin-right:8px;vertical-align:-3px}.mc-icons svg{margin:0!important}
.ex h3 svg{vertical-align:-3px}

/* capital cards */
.cc-ic{display:inline-flex;margin-right:8px}
.s-cc .ct{justify-content:flex-start;align-items:center}
.s-cc .ct h4{flex:1}
.s-cc .hl span{font-size:12.5px;color:var(--ink-3)}
.cc-why{margin:10px 0 12px}
.s-cc .cw{display:none}

/* three-column margins: the cost lines as stacked blocks */
.drv-l{display:flex;flex-direction:column;gap:0;margin-top:4px}
.drv-i{padding:12px 0;border-top:1px solid var(--rule)}
.drv-i:first-child{border-top:0;padding-top:4px}
.drv-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px}
.drv-h b{font-family:var(--fd);font-weight:500;font-size:15px;color:var(--ink)}
.drv-h .lift{font-size:11.5px;color:var(--ink-3);display:inline-flex;align-items:center}
.drv-mv{margin-left:auto;font-weight:600;color:var(--ink);font-size:14px}
.drv-g{font-weight:600;color:var(--accent);font-size:14px}
.drv-i p{margin:6px 0 0;font-family:var(--ft);font-size:13px;line-height:1.5;color:var(--ink-2);font-feature-settings:normal}
.drv-i p b{color:var(--ink);font-family:var(--ft);font-weight:600;font-size:13px}

/* how to read: compact layers beside the colour key */
.lay-compact .lay{margin-top:8px}
.lay-compact .lay-r{grid-template-columns:minmax(0,1fr) 34px minmax(0,1fr);gap:12px;padding:9px 0}
.lay-compact .lay-n{width:26px;height:26px;font-size:12.5px}
.lay-compact .lay-n::before{width:10px}
.lay-compact .lay-t b{font-size:14px}.lay-compact .lay-t span{font-size:12.5px}
.lay-compact .lay-s .ph-q{font-size:15px}.lay-compact .lay-s .ph-a{font-size:18px}
.lay-compact .lay-s .b-metrics{grid-auto-columns:minmax(0,1fr)}.lay-compact .lay-s .b-metrics>div{padding:8px 12px}.lay-compact .lay-s .b-metrics strong{font-size:15px}
.lay-compact .lay-s .how-read{font-size:12.5px;padding:6px 10px}
.lay-compact .ph-steps li button{height:38px;padding:0 14px 0 24px!important;gap:8px}.lay-compact .ph-steps li:first-child button{padding-left:12px!important}.lay-compact .ph-steps .sn{width:20px;height:20px;font-size:11.5px}.lay-compact .ph-steps .st,.lay-compact .ph-steps li.on .st{font-size:13px}
.keys-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:10px}
.keys-2 .key{padding:12px 14px;gap:6px}
.keys-2 .key .chips{gap:5px;font-size:12px}

/* next page on every page */
.page-nav{margin-top:24px}
@media (max-width:1300px){.tl-r{grid-template-columns:120px repeat(6,minmax(0,1fr))}.tv-units{grid-template-columns:repeat(2,1fr)}.keys-2{grid-template-columns:1fr}}

/* ====================== v12 ====================== */
/* crisp page headings, with a clear rule between the heading and the page */
.ph{border-bottom:2px solid var(--ink)!important;padding:4px 0 16px!important;margin:0 0 20px!important;align-items:center!important}
.ph-main{border-left:3px solid var(--accent-fill);padding:2px 0 2px 16px}
.ph-t{margin:0;font-family:var(--fd);font-size:30px;font-weight:500;line-height:1.2;letter-spacing:-.015em;color:var(--ink)}
@media(min-width:1800px){.ph-t{font-size:32px}}

/* section heads read as separators: a full rule above, like the groups on page 03 */
.b-section{display:block;border-top:2px solid var(--ink);padding-top:12px;margin:32px 0 14px}
.b-section .rule{display:none}
.ph+.b-section{border-top:0;padding-top:0;margin-top:4px}

/* every card carries the accent top rule */
.s-panel,.s-cc,.product-panel,#main-content .panel{border-top:3px solid var(--accent-fill)!important}

/* source folds: a rounded accent pill with white text */
.whyd>summary{display:inline-flex!important;align-items:center;gap:8px;background:var(--accent);color:#fff!important;border-radius:999px;padding:6px 14px 6px 13px!important;font-family:var(--f);font-size:12.5px;font-weight:600;line-height:1.2;transition:background .15s}
.whyd>summary::before{color:#fff!important;border-color:#fff!important}
.whyd>summary:hover,.whyd[open]>summary{background:#9A4526;color:#fff!important}
.whyd>summary sup,.whyd>summary sup a{color:#fff!important}
.whyd>summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* page 01: formula boxes — larger headings, the value last */
.eq-f .k{font-family:var(--fd);font-size:17px;font-weight:500;color:var(--ink);letter-spacing:-.005em;line-height:1.25}
.eq-f .w:first-of-type{margin-top:10px}
.eq-f .w:last-of-type{margin-bottom:14px}
.eq-f .v{margin-top:auto;padding-top:12px;border-top:1px solid var(--rule);font-size:26px;line-height:1.1}
.eq-f.res .v{border-top-color:#F0C9B8}

/* page 03: the valuation ledger, larger */
.val-l>.meta{font-size:13.5px}
.val-l h3{font-size:21px!important;margin-top:2px!important}
.val-l .s-ldg{margin-top:16px}
.val-l .s-lr{font-size:15.5px;padding:13px 0;grid-template-columns:20px minmax(0,1fr) auto}
.val-l .s-lr .lb small{font-size:13px;margin-top:3px}
.val-l .s-lr .vl{font-size:18px}
.val-l .s-lr.tot{padding:16px 18px 16px 14px}
.val-l .s-lr.tot .lb{font-size:16px}
.val-l .s-lr.tot .vl{font-size:30px;font-family:var(--fd);font-weight:500}

/* products: the cards take the full width, adhesives on the first row */
.products-layout.full{grid-template-columns:1fr}
.products-layout.full .product-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1100px){.products-layout.full .product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* how to read: banded layer rows and the heading sample */
.lay-band{border-top:0!important;display:flex;flex-direction:column;gap:2px}
.lay-band .lay-r{border-bottom:0!important;padding:10px 14px!important;border-radius:6px}
.lay-band .lay-r:nth-child(odd){background:var(--sunk)}
.ph-demo{border-left:3px solid var(--accent-fill);padding:2px 0 2px 12px}
.ph-demo span{font-family:var(--fd);font-size:20px;font-weight:500;color:var(--ink);letter-spacing:-.01em}
.lay-s .whyd{margin-top:0}
#main-content .eq.stage3{border-top:3px solid var(--accent-fill)!important}
#main-content .table-scroll:not(details .table-scroll){border-top:3px solid var(--accent-fill)!important}

/* ====================== v13 ====================== */
/* key figures: larger, with the lead figure in the accent */
#main-content>.b-metrics span,#main-content .revenue-metric>span{font-size:14.5px;font-weight:500;color:var(--ink-2)}
#main-content>.b-metrics strong,#main-content .revenue-metric>strong{font-size:32px;line-height:1.2;margin:6px 0 0}
#main-content>.b-metrics strong small{font-size:14.5px}
#main-content>.b-metrics>div{padding:16px 26px}
#main-content .revenue-metrics{padding:0;overflow:hidden}
#main-content .revenue-metric,#main-content .revenue-metric:first-child{padding:16px 26px}
#main-content .revenue-metric>p{font-size:12.5px;margin-top:4px}
#main-content .revenue-metric:first-child{background:var(--accent-soft)}
#main-content .revenue-metric:first-child>strong{color:var(--accent)}
.s-sum span{font-size:13.5px;color:var(--ink-2)}.s-sum b{font-size:26px;font-weight:500;font-family:var(--fd)}
.s-sum>div:first-child b{color:var(--accent)}
.lay-s .ans-k strong{color:var(--accent)!important}

/* section heads carry the accent */
.b-section h2,.grp-h h3{color:var(--accent)}

/* guide: the pages table, in reading order */
.pages-t6{table-layout:fixed;width:100%}
.pages-t6 th:nth-child(1){width:64px}.pages-t6 th:nth-child(2){width:15%}.pages-t6 th:nth-child(3){width:22%}.pages-t6 th:nth-child(4){width:17%}.pages-t6 th:nth-child(5){width:17%}
.pages-t6 td{padding-top:12px;padding-bottom:12px;line-height:1.5}
.pages-t6 td:first-child{white-space:normal}
.pages-t6 td:nth-child(2){font-family:var(--fd);font-size:13.5px}
.pages-t6 td:nth-child(2) a{color:var(--ink);text-decoration:none}.pages-t6 td:nth-child(2) a:hover{text-decoration:underline}
.pages-t6 td:nth-child(2) b{color:var(--accent);font-weight:600;margin-right:4px}
.pages-t6 td.ord{position:relative}
.pages-t6 td.ord span{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-family:var(--fd);font-size:13px;font-weight:500;position:relative;z-index:1}
.pages-t6 tr:not(:last-child) td.ord::after{content:'';position:absolute;left:24px;top:38px;bottom:-12px;border-left:1.5px dashed #D9B5A3}
.pages-t6 td.tk{color:var(--ink);font-weight:500}
.pages-t6 td.tk .hl{color:var(--accent);font-weight:600}

/* guide: what each element is, then the element */
.lay-sw .lay-r{grid-template-columns:30px minmax(0,.85fr) minmax(0,1.15fr)!important;gap:14px!important}
.lay-sw .lay-n::before{display:none}
.lay-sw .lay-n{justify-self:start}
.keys-2 .key-wide{grid-column:1/-1}
.cap-ic{display:inline-flex}.cap-ic svg{width:16px;height:16px}

/* capital chart legend note and the cost plan table */
.s-legend .lg-n{margin-left:auto;color:var(--ink-3)}
.burn-t{font-size:12.5px}.burn-t td,.burn-t th{padding:6px 8px}.burn-t tr.b td{font-weight:600;color:var(--ink)}
.keys-2 .key-wide .chips{display:flex;flex-direction:row;flex-wrap:wrap;gap:8px 22px}

/* ====================== v15: page 03 · Funding & returns ====================== */
/* five steps fit the process bar */
.step-host[data-steps="finance"] .stepbar .st{font-size:15px}
.step-host[data-steps="finance"] .stepbar li.on .st{font-size:16px}
.step-host[data-steps="finance"] .stepbar li button{padding:0 18px 0 30px!important;gap:10px}
.step-host[data-steps="finance"] .stepbar li:first-child button{padding-left:16px!important}

/* views inside a section */
.cap-beats{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.cap-beats button{appearance:none;display:inline-flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--rule-2);border-radius:999px;padding:6px 16px 6px 7px;font-family:var(--fd);font-size:14px;font-weight:500;color:var(--ink-2);cursor:pointer}
.cap-beats button span{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--sunk);font-size:12px;color:var(--ink-2)}
.cap-beats button:hover{border-color:var(--ink-3);color:var(--ink)}
.cap-beats button[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.cap-beats button[aria-selected=true] span{background:#fff;color:var(--ink)}
.cap-beats button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* two columns: the chart, then the formulas */
.cap-grid{margin-top:0;align-items:stretch}
.cap-left{display:flex!important;flex-direction:column}
.cap-h{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.cap-h h3{margin:0}
.cap-ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cap-cl{font-size:12px;color:var(--ink-3);margin-left:6px}
.cap-seg button{padding:5px 10px;font-size:12px}
.cap-left .how-read{margin:12px 0 0}
.cap-svg .qhit{fill:transparent;cursor:pointer}
.cap-svg .qhit:hover{fill:rgba(20,20,19,.045)}
.cap-svg .grow{opacity:.9}
.cap-legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:6px;font-size:12.5px;color:var(--ink-2)}
.cap-legend button{appearance:none;display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--rule);border-radius:6px;padding:5px 10px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.cap-legend button b{font-weight:600;color:var(--ink);margin-left:4px}
.cap-legend button[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.cap-legend.static span{display:inline-flex;align-items:center;gap:6px;margin-right:10px}
.cap-legend .lg-n{margin-left:auto;color:var(--ink-3);font-size:12px}
.cap-legend i.ln{display:inline-block;width:18px;border-top:2px solid var(--ink)}
.cap-legend i.ln.d{border-top:1.5px dashed #6B6963}
.cap-legend i.dot{display:inline-block;width:11px;height:11px;border-radius:50%;border:1.5px solid #3D3C38;background:#fff}
.cap-legend i.dot.f{background:#3D3C38}
